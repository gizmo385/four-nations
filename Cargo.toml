[workspace]
resolver = "3"
members = ["crates/runfmt", "crates/sim", "crates/ui", "crates/tui", "crates/agent", "crates/harness", "crates/web", "xtask"]
# `fn_tui` is the game's only frontend: `cargo run` with no `-p` builds and runs it directly.
default-members = ["crates/tui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", features = ["serde"] }
ron = { version = "0.12", features = ["integer128"] }

[profile.dev]
opt-level = 1

# Used by `cargo xtask ci` on CI ($CI set) and by agents with `--fast`: unoptimized dependencies
# and no debug info compile faster and use less memory.
# The web replayer's wasm (`cargo xtask web`, #595): small and fast, since the page downloads
# it and a seek re-simulates turns in it.
[profile.web]
inherits = "release"
lto = true
codegen-units = 1
strip = true

[profile.ci]
inherits = "dev"
opt-level = 0
debug = false

[profile.ci.package."*"]
opt-level = 0

# The hot code of a long clean run, optimised even in the `ci` profile
# (crates/agent/tests/reference_governor.rs plays 330 turns of a grown colony with a Rhai
# governor: the sim's flood fills and path finding, and the Rhai interpreter with the string and
# hash crates it spends its time in). With these at opt-level 3 that test takes about 50 s; with
# everything at the profile's opt-level 1 and dependencies at 0 it takes several minutes. Debug
# assertions and overflow checks stay on, so the sim tests lose no checking. Costs about 2
# minutes of extra build CPU, once per change to these crates.
[profile.ci.package.fn_sim]
opt-level = 3
codegen-units = 1

[profile.ci.package.rhai]
opt-level = 3

[profile.ci.package.smartstring]
opt-level = 3

[profile.ci.package.hashbrown]
opt-level = 3

[profile.ci.package.ahash]
opt-level = 3

# Every world's map generation and every unit's random choice draws from ChaCha streams, and every
# save and load goes through ron. Unoptimised, ChaCha's block function was 70% of making a map
# and ron most of a load. Small crates, so seconds of build for minutes of tests.
[profile.ci.package.rand_chacha]
opt-level = 3

[profile.ci.package.ppv-lite86]
opt-level = 3

[profile.ci.package.rand_core]
opt-level = 3

[profile.ci.package.rand]
opt-level = 3

[profile.ci.package.ron]
opt-level = 3

# nextest runs every test in its own process, so each test that needs the game's data parses
# data/*.toml (150 KB) again. With the parser at opt-level 0 that was about 9% of the whole test
# run. Third-party crates: built once, then cached.
[profile.ci.package.toml]
opt-level = 3

[profile.ci.package.toml_parser]
opt-level = 3

[profile.ci.package.toml_datetime]
opt-level = 3

[profile.ci.package.serde_spanned]
opt-level = 3

[profile.ci.package.winnow]
opt-level = 3

[profile.ci.package.serde]
opt-level = 3

[profile.ci.package.serde_core]
opt-level = 3
