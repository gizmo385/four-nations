[workspace]
resolver = "3"
members = ["crates/sim", "crates/ui", "crates/tui", "crates/client", "xtask"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
rand = "0.10"
rand_chacha = { version = "0.10", features = ["serde"] }
ron = { version = "0.12", features = ["integer128"] }

# Bevy is slow in debug builds; optimize dependencies but keep our own crates fast to compile.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# Used by `cargo xtask ci` on CI ($CI set). Tests don't need Bevy to run fast, so skip optimizing
# dependencies and drop debug info: the cold build is several times faster on small runners.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = false

[profile.ci.package."*"]
opt-level = 0
