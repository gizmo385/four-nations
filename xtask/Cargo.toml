[package]
name = "xtask"
description = "Repo maintenance commands: `cargo xtask ci`."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
# One integration-test binary, `tests/it.rs`, with each other file in tests/ as a module of it.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
fn_runfmt = { path = "../crates/runfmt" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
