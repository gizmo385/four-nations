<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Nations replays</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Four Nations replays</h1>
  <label class="pick" id="pick" hidden>Run
    <select id="runs" disabled><option>no run index</option></select>
  </label>
  <label class="file">Open log…<input id="file" type="file" accept=".jsonl,.txt,.gz,application/json,application/x-ndjson,text/plain,application/gzip"></label>
  <span id="build" class="muted"></span>
  <a class="play" href="play/" title="Play the game in this browser">Play the game</a>
</header>
<main id="stage">
  <canvas id="screen" tabindex="0" aria-label="the replayed game screen"></canvas>
  <div id="message" class="message"><p>Open a run's <code>run.jsonl</code> (or <code>.jsonl.gz</code>, or a <code>.txt</code> copy) with “Open log…”, or drop it here.<br>It's replayed in your browser and never uploaded anywhere.</p></div>
</main>
<footer id="controls" hidden>
  <button id="play" title="Space">Pause</button>
  <button id="slower" title="-">−</button>
  <span id="pace" class="pace">×20</span>
  <button id="faster" title="+">+</button>
  <button id="step" title=".">Step</button>
  <button id="next" title="]">Next turn</button>
  <div id="timeline" class="timeline">
    <div id="marks" class="marks" aria-label="events on the timeline"></div>
    <input id="scrub" type="range" min="0" max="0" value="0" aria-label="turn">
    <div id="tip" class="tip" role="tooltip" hidden></div>
  </div>
  <span id="turn" class="turn">turn 0 / 0</span>
  <span id="legend" class="legend" hidden></span>
  <span class="panes">
    <button data-key="1" title="1: code">Code</button><button data-key="2" title="2: game">Game</button><button data-key="3" title="3: feed">Feed</button><button data-key="0" title="0: studio">Studio</button>
  </span>
  <label class="size">Size
    <select id="size">
      <option value="fit">fit</option>
      <option value="160x45">160×45</option>
      <option value="120x40">120×40</option>
    </select>
  </label>
</footer>
<script type="module" src="replay.js"></script>
</body>
</html>
