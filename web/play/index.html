<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four Nations</title>
<!-- Installable (#974): added to a home screen it opens full screen, sideways and offline. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Four Nations">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- The game in the browser (#843, #859, #866): fn_gui, published at /play/ on the Pages site.
     `cargo xtask web-gui` builds the wasm,
     binds it with the wasm-bindgen CLI (at Cargo.lock's version) into target/replayer/play/ and
     copies this file next to it; add `--serve` to serve it at http://127.0.0.1:8595/play/.
     No query: the title screen, as the desktop app opens. A query with a seed starts that game
     at once (?seed=7&nation=2&size=0), for the scripts. F5 quicksaves, F9 quickloads and F6 opens
     the saves screen; saves live in the browser's localStorage (#860), so they survive a reload
     (`node web/play/check-saves.cjs` and `node web/play/check-play.cjs` check it in headless
     Chromium). The page is an installable web app (#974): manifest.webmanifest, icons/ and
     sw.js, the service worker that keeps a copy for offline play (`node web/play/check-offline.cjs`).
     The `?v=` on the glue and the wasm is the build's hash, which `xtask web-gui` writes in. -->
<style>
  /* The notch and the home bar's insets, read by the game (crates/gui/src/webpage.rs), which
     keeps its widgets inside them; the canvas itself fills the screen. */
  :root {
    --fn-safe-top: env(safe-area-inset-top, 0px);
    --fn-safe-right: env(safe-area-inset-right, 0px);
    --fn-safe-bottom: env(safe-area-inset-bottom, 0px);
    --fn-safe-left: env(safe-area-inset-left, 0px);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #121212; overscroll-behavior: none; }
  /* A finger is the game's: no browser scroll or zoom, no callout or text selection on a long
     press. */
  #the_canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<canvas id="the_canvas"></canvas>
<script type="module">
  import init from './fn_gui.js?v=__FN_BUILD__';
  const t0 = performance.now();
  init({ module_or_path: './fn_gui_bg.wasm?v=__FN_BUILD__' }).then(() => {
    window.fnGuiStarted = performance.now() - t0;
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('no offline copy:', e));
  }
</script>
</body>
</html>
