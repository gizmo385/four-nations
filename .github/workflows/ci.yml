# Runs the same gate agents run locally (`cargo xtask ci`). Branch protection requires this job.
# PRs with auto-merge enabled land once it's green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental builds don't help CI and bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  # fmt, clippy and tests for the whole workspace. The single required status check.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Optimize our own crates (dependencies stay at opt-level 0 via profile.ci.package."*").
      # The long simulation tests run about 7x faster, cutting this job from ~10 to ~4 minutes,
      # for ~15s more build time. Lint results don't depend on opt-level.
      CARGO_PROFILE_CI_OPT_LEVEL: 1
    steps:
      - uses: actions/checkout@v7
      # The toolchain (version, components, wasm32 target) is pinned in rust-toolchain.toml, the one
      # source shared with flake.nix and local rustup. Change it there, not here.
      - run: rustup toolchain install
      # The cargo registry and git checkouts. target/ is cached by the steps below instead:
      # rust-cache's key only changes with Cargo.lock, so it never re-saves a newer build of our
      # own crates.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          # Only main writes the cache; PRs restore it. Keeps us within the private-repo quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # All of target/, dependencies and workspace crates, from main's newest build with this
      # toolchain and Cargo.lock, or failing that with this toolchain and any Cargo.lock (cargo
      # rebuilds whatever dependency changed and reuses the rest). Each push to main saves a new
      # one (keyed by commit); GitHub evicts the oldest past the repository's cache limit.
      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      # Backdates the sources that haven't changed since that build, so cargo reuses the crates
      # built from them (fn_sim's opt-level-3 build is most of a cold build) and rebuilds the rest.
      - run: scripts/ci-cache-mtimes.sh
      # `cargo xtask ci` runs the tests with nextest when it's installed (and requires it on CI):
      # all test binaries share one pool instead of running one after another.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo xtask ci
      # Saved even when the gate fails or times out: whatever cargo finished building is still a
      # correct cache (its fingerprints are written after the artifact), and without it every PR
      # after a red main push would build from scratch.
      - if: always() && github.ref == 'refs/heads/main'
        run: mkdir -p target && git rev-parse HEAD > target/.cache-commit
      - if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
