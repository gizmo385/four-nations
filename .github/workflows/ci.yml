# Runs the same gate agents run locally (`cargo xtask ci`). Branch protection requires this job.
# PRs with auto-merge enabled land once it's green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental builds don't help CI and bloat the cache.
  CARGO_INCREMENTAL: 0

jobs:
  # fmt, clippy and tests for the whole workspace. The single required status check.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optimize our own crates (dependencies stay at opt-level 0 via profile.ci.package."*").
      # The long simulation tests run about 7x faster, cutting this job from ~10 to ~4 minutes,
      # for ~15s more build time. Lint results don't depend on opt-level.
      CARGO_PROFILE_CI_OPT_LEVEL: 1
      # One fixed build id (crates/tui/build.rs): a pull request's checkout would otherwise get a
      # new id every run and rebuild fn_tui and everything above it, whatever the change. Hex,
      # as a real id is; nothing built here is published, and the caches keyed by it
      # (~/.cache/four-nations) start empty on every runner.
      FN_BUILD_ID_OVERRIDE: c1c1c1c
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit and its first parent, for the scope step's diff on a pull request.
          fetch-depth: 2
      # `docs` when the change touches only documents, else `full` (scripts/ci-scope.sh). A pull
      # request is checked out as its merge into the base, so its first parent is the base. A
      # push is compared with the commit main was at before. When the other side can't be had
      # (a first push, a rewritten branch), the list is empty and the scope is `full`.
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            files="$(git diff --name-only --no-renames HEAD^1 HEAD || true)"
          elif git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
            files="$(git diff --name-only --no-renames "$BEFORE" HEAD || true)"
          else
            files=""
          fi
          scope="$(scripts/ci-scope.sh <<< "$files")"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "ci scope: $scope ($(grep -c . <<< "$files" || true) files changed)"
      # The toolchain (version, components, wasm32 target) is pinned in rust-toolchain.toml, the one
      # source shared with flake.nix and local rustup. Change it there, not here.
      - run: rustup toolchain install
      # The cargo registry and git checkouts. target/ is cached by the steps below instead:
      # rust-cache's key only changes with Cargo.lock, so it never re-saves a newer build of our
      # own crates.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          # Only main writes the cache; PRs restore it. Keeps us within the private-repo quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # All of target/, dependencies and workspace crates, from main's newest build with this
      # toolchain and Cargo.lock, or failing that with this toolchain and any Cargo.lock (cargo
      # rebuilds whatever dependency changed and reuses the rest). Each push to main saves a new
      # one (keyed by commit); GitHub evicts the oldest past the repository's cache limit.
      - uses: actions/cache/restore@v6
        with:
          path: target
          key: target-v2-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            target-v2-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-
            target-v2-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      # Backdates the sources that haven't changed since that build, so cargo reuses the crates
      # built from them (fn_sim's opt-level-3 build is most of a cold build) and rebuilds the rest.
      - run: scripts/ci-cache-mtimes.sh
      # `cargo xtask ci` runs the tests with nextest when it's installed (and requires it on CI):
      # all test binaries share one pool instead of running one after another.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - if: steps.scope.outputs.scope != 'docs'
        run: cargo xtask ci
      # fn_gui (the egui game, #859) is outside the gate above, so its browser build gets its own
      # step: a wasm32 break in it, or in the font and theme setup, fails the job. `xtask web-gui`
      # needs the wasm-bindgen CLI at exactly the version Cargo.lock pins for the crate; the
      # prebuilt release binary installs in seconds, so there is nothing to cache.
      - id: wbg
        if: steps.scope.outputs.scope != 'docs'
        run: |
          version="$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/[^0-9.]/, "", $3); print $3 }' Cargo.lock)"
          echo "wasm-bindgen $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.scope != 'docs'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - if: steps.scope.outputs.scope != 'docs'
        run: cargo xtask web-gui --fast
      # A change to documents only: the tests that read docs/. The job, and so the required
      # check, still reports.
      - if: steps.scope.outputs.scope == 'docs'
        run: cargo xtask ci --docs-only
      # target/.cache-commit names the commit the cache's workspace crates were built from, and
      # scripts/ci-cache-mtimes.sh trusts it: files unchanged since that commit are made to look
      # older than the artifacts. That is only true of a run whose whole gate passed, so only
      # such a run stamps and saves. A failed run saves nothing: the last good cache stays the
      # newest, and later runs rebuild what changed since it. (A run that failed before it built
      # anything once stamped the older build it had restored as its own, and every run after
      # it reused a stale fn_tui. The `v2` in the key leaves those caches behind.)
      # Not for a documents-only push either: it built nothing new.
      - if: success() && github.ref == 'refs/heads/main' && steps.scope.outputs.scope != 'docs'
        run: mkdir -p target && git rev-parse HEAD > target/.cache-commit
      - if: success() && github.ref == 'refs/heads/main' && steps.scope.outputs.scope != 'docs'
        uses: actions/cache/save@v6
        with:
          path: target
          key: target-v2-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
