# Publishes the web replayer (#595, #596) and the game itself (#866) to GitHub Pages on every push
# to main. The replayer is at the site's root: a viewer opens a run's run.jsonl from their own
# disk and it is replayed in their browser, never uploaded. The game (fn_gui built for the
# browser) is at /play/. The site is public: anyone with its URL can load the game.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with ci.yml's toolchain.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages
      - name: Build the replayer
        run: cargo xtask web
      # The game, into target/replayer/play/ so it is published at .../four-nations/play/.
      # `xtask web-gui` needs the wasm-bindgen CLI at exactly the version Cargo.lock pins for the
      # crate (as in ci.yml). The `web` profile (optimised, LTO), not `--fast`. It leaves the
      # replayer's files alone and `xtask web` leaves play/ alone, so the order doesn't matter.
      - id: wbg
        run: |
          version="$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/[^0-9.]/, "", $3); print $3 }' Cargo.lock)"
          echo "wasm-bindgen $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wbg.outputs.version }}
      - name: Build the game
        run: cargo xtask web-gui
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/replayer
      - id: deploy
        uses: actions/deploy-pages@v4
