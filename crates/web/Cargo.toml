[package]
name = "fn_web"
description = "The web replayer (#595): fn_tui's replayer (`fn_tui::replay`) compiled to wasm32 behind a small C ABI, plus the cell encoding the page draws. Depends on fn_tui only."
edition.workspace = true
version.workspace = true
license.workspace = true
# One integration-test binary, `tests/it.rs`, with each other file in tests/ as a module of it.
autotests = false

# `cdylib` is the .wasm the page loads; `rlib` lets the native tests drive the same ABI.
[lib]
name = "fn_web"
crate-type = ["cdylib", "rlib"]

[dependencies]
fn_tui = { path = "../tui" }
ratatui = { version = "0.30", default-features = false }

[[test]]
name = "it"
path = "tests/it.rs"

[dev-dependencies]
fn_sim = { path = "../sim" }
