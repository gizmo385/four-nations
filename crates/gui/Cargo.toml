[package]
name = "fn_gui"
description = "Spike (#842): an egui window around the game: a pan/zoom glyph map, the existing screens painted as ratatui buffers, and one side-panel section as real egui widgets. In `cargo xtask ci` (no GPU needed), not in default-members."
edition.workspace = true
version.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
fn_sim = { path = "../sim" }
fn_tui = { path = "../tui" }
fn_ui = { path = "../ui" }
ratatui = { version = "0.30", default-features = false }
# glow (OpenGL), not wgpu: a smaller build, and it runs on Mesa's software renderer under Xvfb
# for screenshots. The cells are painted by `fn_gui::cells` (#872), so nothing holds egui back.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
# egui 0.37 no longer bundles its monochrome emoji fonts by default, and the data's `⌖` and `⛩`
# are only in them (`fonts.rs` has the other symbols). Only the feature: eframe brings egui.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
# `std::time::Instant` panics on wasm32; web-time is std's on native and `performance.now()` on
# the web (#843's egui-in-the-browser check).
web-time = "1"
# Browser saves (#860): a slot is stored deflated and base64'd, since `localStorage` holds about
# 5 MB and a save is up to 10. Both crates are already in the lockfile.
miniz_oxide = "0.9"
base64 = "0.22"
unicode-width = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob", "BlobPropertyBag", "CssStyleDeclaration", "Document", "DomException", "Element",
    "Event", "EventTarget", "File", "FileList", "HtmlAnchorElement", "HtmlCanvasElement",
    "HtmlInputElement", "KeyboardEvent", "Location", "Navigator", "Storage", "Url", "Window",
] }

[dev-dependencies]
# Semantic UI tests (#875): a `Harness` runs `GuiApp` headlessly and finds widgets through the
# AccessKit tree. No renderer, so no GPU: this is what the gate builds. Not its `eframe` feature:
# that pulls in accesskit_winit and zbus (50 crates). The pixel path is the `shots` feature.
egui_kittest = "0.37"

[features]
# The pixel path (#875): kittest renders through wgpu, which needs an adapter (a GPU, or Mesa's
# lavapipe). Off in the gate; `cargo xtask gui-shot` turns it on, as does
# `cargo test -p fn_gui --features shots`.
shots = ["egui_kittest/wgpu", "egui_kittest/snapshot"]

[[example]]
name = "shot"
path = "examples/shot.rs"
required-features = ["shots"]
