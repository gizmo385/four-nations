[package]
name = "fn_tui"
description = "The terminal frontend: a glyph map, a cursor and the session clock, on ratatui and crossterm. Depends on fn_sim and fn_ui only."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "fn_tui"

[[bin]]
name = "fn_tui"
path = "src/main.rs"

[dependencies]
fn_sim = { path = "../sim" }
fn_ui = { path = "../ui" }
ratatui = "0.30"
crossterm = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
unicode-width = "0.2"
