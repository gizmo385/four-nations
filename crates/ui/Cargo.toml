[package]
name = "fn_ui"
description = "Frontend logic for the terminal UI and the window UI: tools, view text, alerts, the session clock, the game's UI state and key handling. Depends on fn_sim only: no engine, no wall-clock reads, and no I/O outside the save files."
edition.workspace = true
version.workspace = true
license.workspace = true
# One integration-test binary, `tests/it.rs`, with each other file in tests/ as a module of it.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[features]
# `Serialize` on the public view-model types (#858), for a frontend that hands them to a webview
# or a script as JSON. Off by default: the terminal UI and the window UI don't need it.
serde = ["dep:serde"]

[dependencies]
fn_sim = { path = "../sim" }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
