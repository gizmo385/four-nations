# The Avatar's portrait (#245, end game #224): 32x32 head and shoulders, facing three-quarters to
# the right, drawn at 2x (64px) in the selection bar's 96px portrait well. Light from the top left.
# It matches art/avatar_aang.toml: the blue arrow, a yellow shirt under an orange mantle, and the
# glider staff (folded red wings) standing behind his near shoulder. Next to `air_monk`
# (art/faces_air.toml) he is younger: a rounder crown over a smaller chin, bigger eyes and a grin.
# Sprite 1 is the same grid with the Avatar State's glow: only the legend changes, so the arrow
# and the eyes light up and nothing else moves. See docs/design/endgame.md and
# docs/design/pixel-art.md (Units and portraits).
