# Buildings: 32x32 map sprites, drawn at 1:1 and bottom-aligned to the tile they stand on
# (docs/design/pixel-art.md). A building is 2x2 map cells at most; the tile it stands on is the
# bottom-centre 16x16 (x 8..23, y 16..31), and its feet end on row 30 so row depth sorts it like a
# tree. Neutral colours only: the nation shows in the shape and material, not the accent.
#
# `data/buildings.toml` names the sprite of every building: its `id`, or `art[nation]` for one
# that looks different per nation. A client test checks that every drawn building has its sprite
# here, at the cell the client names. The sheet is 4 wide: row 0 is the bed and the three
# campfire frames, row 1 the four study halls, row 2 the fallback for a building with no art yet.
#
# Keys (the outline is automatic, so grids hold fills only):
#   1-5 stone0-4     6-9 wood0-3       b-e sand0-3      f-h cream0-2
#   j-m water0-3     n q t u red0-3    v x y z gold0-3  E-I leaf0-4
#   J K M N earth0-3 P Q R snow0-2     S T U mud0-2     w white
cell = [32, 32]
columns = 4
outline = true

[legend]
"1" = "stone0"
"2" = "stone1"
"3" = "stone2"
"4" = "stone3"
"5" = "stone4"
"6" = "wood0"
"7" = "wood1"
"8" = "wood2"
"9" = "wood3"
b = "sand0"
c = "sand1"
d = "sand2"
e = "sand3"
f = "cream0"
g = "cream1"
h = "cream2"
j = "water0"
k = "water1"
l = "water2"
m = "water3"
n = "red0"
q = "red1"
t = "red2"
u = "red3"
v = "gold0"
