# Aang, the Avatar (#244, end game #224): 64x96, 16px cells. Columns face down, up, left, right;
# rows 0-3 are idle and the walk, rows 4-5 the Air bend stance and release, as on every unit sheet
# (docs/design/pixel-art.md, "Units and portraits", "Bend poses"). He is the air monk's build with
# the blue arrow, a yellow shirt under an orange mantle, and the glider staff (folded red wings) in
# hand in every cell. The right-facing cells mirror the left-facing ones. The Avatar State is not a
# cell: the client swaps colours or overlays an effect (docs/design/endgame.md).
