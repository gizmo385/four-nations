# The Harmony Gate (#246, docs/design/endgame.md): the end-game plaza, 64x80 cells. The bottom
# 64x64 is the 4x4 footprint, bottom-aligned like every building (feet on row 78, the outline on
# row 79 and on the cell's left and right edges, so the plaza fills its four tiles exactly); the
# top 16 rows are the roof overhang. The plaza is walkable: flagstones in a running bond inside a
# curb, steps down the front face. Light from the top left. Neutral stone; the nation shows only
# in the roof tiles.
#
# Sprites, two per row (`columns = 2`):
#   row 0  foundation (stage 1, the site being levelled) and pillars (stage 2: the paved plaza
#          with four empty plinths)
#   rows 1-2  pillar_air, pillar_water, pillar_earth, pillar_fire: one pillar each, alone in a
#          full 64x80 cell at its plinth, drawn over `pillars` so the pillars finish in any order.
#          Air is back left, water back right, earth front left, fire front right, matching the
#          quadrants of the ring in the middle.
#   rows 3-6  complete_<nation> (stages 3 and 4: emblem unlit) and complete_lit_<nation> (the
#          Harmony Rite done: the ring and the plaque glow), one row per nation in
#          data/nations.toml order. All eight are the same grid; only the roof legend (R S T U,
#          darkest first) changes: gold for air, blue for water, green for earth, red for fire.
#
# Keys (the outline is automatic, so grids hold fills only):
#   1-5 stone0-4   6-9 wood0-3    b c d mud0-2    e f g h gold0-3   q r t u water0-3
#   v x y z red0-3  E-I leaf0-4   J K M cream0-2   w white          R S T U the roof

