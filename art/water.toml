# Water and shore autotiles (docs/design/pixel-art.md; #146). Three 4x4 sets of 16px cells, one per
# land colour, stacked in this order: sand (rows 0-3), snow (rows 4-7), grass (rows 8-11). The
# client's `WaterSet` (sprites/water.rs) reads each set as
#
#   nw      n       ne       v_top    land N, E, W
#   w       .       e        v_mid    land N, S
#   sw      s       se       v_bot    land S, E, W
#   h_left  h_mid   h_right  .alt     land N, S, W / E, W / N, S, E; the last cell is the second
#                                     open-water variant (the pack's "isolated" slot)
#
# A piece named for a side has land on that side. Land is drawn in the floor's base tone (`g`, the
# `,` tone of the textured floors) for 2px, then a 1px bank (`G`), so a shore meets its floor
# without a seam. Water is `2` with waves in `3`/`4`; `1` is the shadow under a bank. The fish
# spot (last cell) is drawn over any water tile, on a transparent background.
cell = [16, 16]
columns = 4

[legend]
"1" = "water0"
"2" = "water1"
"3" = "water2"
"4" = "water3"


