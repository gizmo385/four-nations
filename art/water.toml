# Water and shore autotiles (docs/design/pixel-art.md; #146, #31). A 4-cell-wide sheet of 4x4 sets of
# 16px cells, stacked top to bottom (cell row = sprite index / 4):
#
#   rows  0-11  sea    sand (0-3), snow (4-7), grass (8-11)   blue ramp `water`   names `sand_nw`
#   rows 12-23  river  sand, snow, grass                      teal ramp `fresh`   names `river_sand_nw`
#   rows 24-35  lake   sand, snow, grass                      teal ramp `fresh`   names `lake_sand_nw`
#   row  36     extras: the fish spot, then (#171) the pond piece
#
# Add a new water body as three more 4x4 sets before the extras row and a new extra at the end, so
# no earlier cell moves. The client's `WaterSet` (sprites/water.rs) reads each set as
#
#   nw      n       ne       v_top    land N, E, W
#   w       .       e        v_mid    land N, S
#   sw      s       se       v_bot    land S, E, W
#   h_left  h_mid   h_right  .alt     land N, S, W / E, W / N, S, E; the last cell is the second
#                                     open-water variant (the pack's "isolated" slot)
#
# A piece named for a side has land on that side. Land is drawn in the floor's base tone (`g`, the
# `,` tone of the textured floors) for 2px, then a 1px bank (`G`), so a shore meets its floor
# without a seam. Water is `2` with marks in `3`/`4`; `1` is the shadow under a bank. Every set
# draws the same shapes, only the ramp and the marks differ:
#
#   sea    `water` blue; short 3px dashes (white sparkle in the snow sets) scattered over the open
#          water: choppy.
#   river  `fresh` teal, bound per sprite; long thin current streaks, along the flow in the
#          straits (`v_mid`/`h_left`/`h_right` run east-west, `h_mid`/`v_top`/`v_bot` north-south)
#          and east-west in open water.
#   lake   `fresh` teal; calm: a few 1px glints and small ring ripples, no dashes.
#
# The river and lake sets were generated from the sea's (the shapes are identical) and are edited
# by hand like any other sprite. The fish spot is drawn over any water tile, on a transparent
# background.
cell = [16, 16]
columns = 4

[legend]
"1" = "water0"
"2" = "water1"
"3" = "water2"
"4" = "water3"


