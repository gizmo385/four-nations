# Water Tribe buildings (#178): 32x32 map sprites on the same footing as `buildings.toml`: drawn at
# 1:1, bottom-aligned to the tile they stand on (the bottom-centre 16x16, x 8..23, y 16..31), feet
# on row 30, 1px ink outline, light from the top left, neutral colours.
#
# The igloo is a bed that sleeps warmer, so it is bed-scale and nothing like the Elders' Lodge
# (`buildings.toml`): a smooth snow dome about half the lodge's size, no flag, a short entrance
# tunnel facing down and right with a fur flap over the door, and snow banked against its sides.
# The lodge is a tall block-built hall with a flag; the igloo is low and round.
#
# Keys (the outline is automatic, so grids hold fills only):
#   1-5 stone0-4     6-9 wood0-3       b-e sand0-3      f-h cream0-2
#   j-m water0-3     n q t u red0-3    v x y z gold0-3  E-I leaf0-4
#   J K M N earth0-3 P Q R snow0-2     S T U mud0-2     w white
cell = [32, 32]
columns = 4
outline = true

