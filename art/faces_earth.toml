# Earth Kingdom portraits (#153): farmer, guard and villager. 32x32 head and shoulders, facing three-quarters to the right, drawn at 2x (64px)
# in the selection bar's 96px portrait well. Light from the top left. Each face matches the clothes
# and palette ramps of the unit sheet of the same name (art/<id>.toml). Sprite `n` is column `n`:
# `characters.rs` names the cell. See docs/design/pixel-art.md (Units and portraits).
cell = [32, 32]
columns = 3
outline = true

