# Fire Nation buildings (#177): 32x32 map sprites in the style of the study halls
# (art/buildings.toml, docs/design/pixel-art.md): drawn at 1:1, bottom-aligned to the tile they
# stand on, a 1px ink outline, light from the top left, a stone plinth, neutral colours. The
# forge, kiln, smelter and engine burn or steam in 3 frames (`<name>`, `<name>_2`, `<name>_3`);
# the lightning station crackles in 2.
#
# The sheet is 4 wide, a building's frames in a row (they may wrap onto the next):
#   row 0: forge, forge_2, forge_3, brick_kiln
#   row 1: brick_kiln_2, brick_kiln_3, smelter, smelter_2
#   row 2: smelter_3, steam_engine, steam_engine_2, steam_engine_3
#   row 3: lightning_station, lightning_station_2
# `crates/client/src/sprites/buildings.rs` names each cell, and a test checks it against the name.
#
# Keys (the outline is automatic, so grids hold fills only):
#   1-5 stone0-4     6-9 wood0-3       b-e sand0-3      f-h cream0-2
#   j-m water0-3     n q t u red0-3    v x y z gold0-3  E-I leaf0-4
#   J K M N earth0-3 P Q R snow0-2     S T U mud0-2     w white
cell = [32, 32]
columns = 4
outline = true

