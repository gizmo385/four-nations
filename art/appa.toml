# Appa resting (#247, end game #224): a 48x32 prop, the 3x2 tiles beside the Harmony Gate where
# Appa waits while Aang stays (docs/design/endgame.md, "The Avatar"). He lies on the ground facing
# left (west, the side he lands on): the head with the brown arrow pointing down between the eyes,
# a cream horn, the eyes closed; the folded haunch and the flat tail, its tip curled up, with the
# arrow's end; the saddle (wood) on a red blanket with a gold band and tassels. Light from the top
# left, the fur on the stone ramp up to `white`. Bottom-aligned like a building: paws on row 30, the
# outline on row 31.
#
# Sprites, one row (`columns = 2`): `appa_rest_0` (breathing out) and `appa_rest_1` (breathing in:
# the back, blanket and saddle 1px higher over columns 16-42). Played as a slow 2-frame loop.
#
# Keys (the outline is automatic, so grids hold fills only):
#   1-5 stone1-4, white (the fur)   k B c C wood0-3   q r R red0-2   g G gold1-2   n e E cream0-2
#   o ink (the closed eye)

cell = [48, 32]
columns = 2
outline = true

[legend]
"1" = "stone1"
"2" = "stone2"
"3" = "stone3"
"4" = "stone4"
"5" = "white"
k = "wood0"
B = "wood1"
c = "wood2"
C = "wood3"
q = "red0"
r = "red1"
R = "red2"
g = "gold1"
G = "gold2"
n = "cream0"
e = "cream1"
E = "cream2"

