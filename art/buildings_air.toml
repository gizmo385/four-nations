# Air Nomad buildings (#176): 32x32 map sprites on the same footing as `buildings.toml`: drawn at
# 1:1, bottom-aligned to the tile they stand on (the bottom-centre 16x16, x 8..23, y 16..31), feet
# on row 30, 1px ink outline, light from the top left, neutral colours. Air Temple wood, cream
# plaster and gold, open and airy; the same stone plinth as the study halls.
#
# The sheet is 4 wide: row 0 is the orchard and the three windmill sail frames, row 1 the three
# wind turbine blade frames and the bison stable. The windmill's sails turn in 30 degree steps (a
# quarter turn is 90) and the turbine's blades in 40 (a third of a turn is 120), so `frames`
# plays them as a steady spin. A client test checks each cell against the sprite name.
#
# Keys are `buildings.toml`'s (the outline is automatic, so grids hold fills only):
#   1-5 stone0-4     6-9 wood0-3       b-e sand0-3      f-h cream0-2
#   j-m water0-3     n q t u red0-3    v x y z gold0-3  E-I leaf0-4
#   J K M N earth0-3 P Q R snow0-2     S T U mud0-2     w white
cell = [32, 32]
columns = 4
outline = true

