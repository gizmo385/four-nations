# Mountain cliffs and boulders (docs/design/pixel-art.md, #147). Two cliff sets, `rock` (grey-brown
# face, rock top; every biome but tundra) and `snow` (grey face, snow top; tundra). One piece for
# every way a mountain tile can meet lower ground: the lower sides (n, s, e, w) and, for a side
# pair that is mountain, a lower diagonal (_nw, _ne, _sw, _se: an inner corner). `flat` has no
# lower neighbour at all: it is the floor's first variant (rock0, snow0 in floors.toml, same
# marks), which the client draws only through `floors`' four variants. Names go in the order
# `sprites::cliffs` expects: for each lower-side mask (n=1, s=2, e=4, w=8) the inner-corner
# subsets in the order nw, ne, sw, se. The tops have the rock and snow floors' tones and marks.
#
# The faces are painted into the lower rows of the pieces that have lower ground to the south, so
# nothing overlaps the row below. Every pixel is opaque: the ink line is the plateau's edge.
#
# Legend (one global colour per character, so the sets share a grid style):
#   o ink   0-4 stone ramp   a-d earth ramp (grey-brown rock face)   x-z snow ramp   w white
cell = [16, 16]
columns = 10

[legend]
o = "ink"
"0" = "stone0"
"1" = "stone1"
"2" = "stone2"
"3" = "stone3"
"4" = "stone4"
a = "earth0"
b = "earth1"
c = "earth2"
d = "earth3"
x = "snow0"
y = "snow1"
z = "snow2"


