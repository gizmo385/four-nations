# Trees: 32x32 map sprites, drawn at 1:1 and bottom-aligned to their tile (docs/design/pixel-art.md).
# The sprite is 2x2 map cells; the tile it stands on is its bottom-centre 16x16 (x 8..23, y 16..31),
# where the trunk is. Neutral colours only: trees look the same in every nation.
#
# Row 0 is the whole tree. Row 1 repeats each tree with the trunk (digits 6-9) removed, so the
# client can fade just the canopy (#77). A client test keeps the two rows in step.
#
# Keys: 1-5 leaf0-leaf4, 6-9 wood0-wood3 (the trunk, and only the trunk), r/R/k fruit, w/q/x snow.
cell = [32, 32]
columns = 4
outline = true

[legend]
"1" = "leaf0"
"2" = "leaf1"
"3" = "leaf2"
"4" = "leaf3"
"5" = "leaf4"
"6" = "wood0"
"7" = "wood1"
"8" = "wood2"
"9" = "wood3"
r = "red1"
R = "red2"
k = "red0"
w = "white"
q = "stone4"
x = "stone3"

