# --- rail: generated by gen_rail.py (#135) ---

# Rail (#135): sixteen flat pieces of track, `rail` (nothing joined) then `rail_2` .. `rail_16`
# for the neighbours a tile joins, N=1 E=2 S=4 W=8, so sprite `1 + mask` of this sheet. Each
# fills its 16px tile exactly (x 8..23, y 16..31, no outline, row 31 included) so pieces meet
# edge to edge: an arm runs bed (10px of packed earth) and rails (stone, two pixels apart
# by gauge) to the middle of the tile edge it joins, with wooden sleepers across. The client
# picks the piece from the rail tiles around (`sprites/buildings.rs`, `link_frame`).

