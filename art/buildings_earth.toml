# Earth Kingdom buildings (#175): 32x32 map sprites on the same footing as `buildings.toml`: drawn
# at 1:1, bottom-aligned to the tile they stand on (the bottom-centre 16x16, x 8..23, y 16..31), feet
# on row 30, 1px ink outline, light from the top left, neutral colours.
#
# earth_wall is the one impassable 1x1 piece. It fills its tile exactly (fills x 9..22, so the
# outline is x 8 and 23) and rises 18px: neighbouring walls sit side by side with a two-pixel
# joint between them and never overlap, so a run of walls reads as a battlement with no autotile.
# The merlons at the two ends of a segment pair up into one wide merlon across the joint.
#
# The sheet is 4 wide; so far it is one sprite. A client test checks each cell against the name.
#
# Keys are `buildings.toml`'s (the outline is automatic, so grids hold fills only):
#   1-5 stone0-4     6-9 wood0-3       b-e sand0-3      f-h cream0-2
#   j-m water0-3     n q t u red0-3    v x y z gold0-3  E-I leaf0-4
#   J K M N earth0-3 P Q R snow0-2     S T U mud0-2     w white
cell = [32, 32]
columns = 4
outline = true

