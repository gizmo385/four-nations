m = "water3"
n = "red0"
q = "red1"
t = "red2"
u = "red3"
v = "gold0"
x = "gold1"
y = "gold2"
z = "gold3"
E = "leaf0"
F = "leaf1"
G = "leaf2"
H = "leaf3"
I = "leaf4"
J = "earth0"
K = "earth1"
M = "earth2"
N = "earth3"
P = "snow0"
Q = "snow1"
R = "snow2"
S = "mud0"
T = "mud1"
U = "mud2"

