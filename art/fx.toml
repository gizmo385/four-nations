# ---------------------------------------------------------------------------------------------
# Cast animations (#166): the moment of a bend, drawn by crates/client/src/cast.rs. One family per
# row, in the order of the abilities' effects; each plays on the session clock (world ticks), so
# a paused game holds a still frame. Frames are drawn on clear pixels and centred on the cell, so
# a particle (a droplet, a gust) can be placed anywhere along a path.
#
#   row 2: earth_0..2   Raise Earth: cracks, rock spikes, stepping stones, on the target tile.
#   row 3: dust_0..2    the dust the stones kick up as they settle.
#   row 4: drop_0..2    Water the Land: a droplet of the stream from bender to target.
#   row 5: splash_0..2  the stream landing: a ring, a crown, a settling ripple.
#   row 6: spark_0..2   Hearthflame: sparks gathering, the flare, embers rising.
#   row 7: gust_0..2    Wind Carry: a wisp of the gust (and the trail behind a flying stack).
#   row 8: swirl_0..2   the whirl that lifts the stack off its tile.

