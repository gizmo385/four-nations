# Bending effects on the map, 16px, drawn at 1:1 over the floor. Three columns, one family per row.
# Rows 0-1 are the lasting effects (crates/client/src/bending.rs); rows 2-9 are #166's and #123's
# cast animations (crates/client/src/cast.rs), and row 10 is Inner Fire's lasting aura
# (crates/client/src/bending.rs), described below.
#
#   row 0: flame_0 flame_1 flame_2    a lit Hearthflame. Cycled on the session clock (world ticks),
#                                     so a paused game holds a still flame.
#   row 1: wet_0   wet_1   wet_2      a watered tile: damp soil and puddles on clear pixels, so the
#                                     floor shows through. A tile picks one by a stable hash.
#
# Flames carry the 1px ink outline and sit on a ring of pebbles. Wet marks are not outlined and
# stay 1px inside the cell, so a 3x3 patch reads as one wet area.
cell = [16, 16]
columns = 3

[legend]
k = "stone1"
l = "stone2"
m = "stone3"

[[sprite]]
name = "flame_0"
outline = true
legend = { "1" = "red0", "2" = "red1", "3" = "red2", "4" = "red3", "5" = "gold2", "6" = "gold3" }
