# Unit needs: hunger, thirst, energy and health. Design: docs/design/vision.md ("Survival pressure").
#
# Every need is a meter from 0 to `max` where `max` is fully satisfied. Rates are per IN-GAME
# MINUTE; the sim converts them to per-tick amounts using TICKS_PER_SECOND, so changing the tick
# rate never changes balance.
#
# - Hunger, thirst and energy fall by `decay_per_minute`. `low` is the level at which a unit
#   starts looking for a way to fix it (the job system, #4, reads this).
# - A need at 0 is "depleted". Each depleted need drains health by
#   `health.depleted_damage_per_minute`. At 0 health the unit dies and is removed.
# - When no need is below its `low` level, health recovers by `health.regen_per_minute`.
#
# Owner requirement (#3, docs/design/research.md): nobody may starve because their nation lacks
# fire. Every food below must work raw; `cooked_hunger` is an optional bonus unlocked by
# `fire_making`, never a requirement. Loading fails unless every raw food restores at least as
# much hunger as a unit loses over `expected_meal_minutes`, so a unit eating raw food at that
# pace never starves.

[settings]
max = 100.0
# How often a unit is expected to get to eat or drink, in in-game minutes. Used to validate that
# raw food alone can sustain a unit (see above).
expected_meal_minutes = 6.0
# Thirst restored by one drink of water.
drink_thirst = 50.0
# Energy restored per minute of sleep. Energy does not decay while asleep.
sleep_energy_per_minute = 15.0

[hunger]
decay_per_minute = 4.0    # full to empty in 25 minutes
low = 40.0

[thirst]
decay_per_minute = 6.0    # full to empty in about 17 minutes
low = 40.0

[energy]
decay_per_minute = 3.0    # full to empty in about 33 minutes
low = 30.0

[health]
max = 100.0
depleted_damage_per_minute = 10.0   # per depleted need
regen_per_minute = 2.0

# Population growth (#232, docs/design/endgame.md "Population growth"): a newcomer walks in
# from the nearest map edge when draw (below) reaches 1, the beds hold more than the settlers
# and food_per_newcomer food items are in stores. arrival_minutes is the minutes per newcomer at
# 100% draw: 10 instead of 15 (docs/design/materials.md section 4, #353), so growth draws down
# the leaner food supply above instead of outrunning it with nothing to spend it on.
[growth]
arrival_minutes = 10.0     # minutes per newcomer at 100% draw
food_per_newcomer = 30
# Once the Harmony Gate is complete, each newcomer's nation is drawn weighted: own_weight for
# the settlement's own nation, other_weight for each of the other three (docs/design/endgame.md,
# "The transformation: the United City"). Before completion every newcomer is the settlement's
# own nation, whatever these say.
own_weight = 0.4
other_weight = 0.2

# Draw (#435, docs/design/pacing.md section 1): a meter that fills by multiplier / arrival_minutes
# a minute, where multiplier = base + food_kind per food kind beyond the first with at least
# food_kind_min in stores (up to food_kinds_max) + warm_beds if every bed is heated + spare_bed
# per free bed beyond the first (up to spare_beds_max), capped at max. At 1 (and with a bed and
# food) one newcomer arrives and 1 is spent. While the bed or food is missing it stops filling at
# 1, so a late bed brings one newcomer, not several. Only grants (World::add_draw) lift it past 1,
# up to bank; arrivals are at least min_gap_minutes apart.
[growth.draw]
base = 0.6                 # 16.7 min per newcomer
food_kind = 0.2
food_kind_min = 10         # stored items of one food for it to count
food_kinds_max = 2         # kinds beyond the first that count
warm_beds = 0.2
spare_bed = 0.1
spare_beds_max = 2
max = 1.4                  # 7.1 min per newcomer
bank = 2.0                 # the most draw can hold, grants included
min_gap_minutes = 2.0

# Foods. `hunger` is what one raw item restores. `cooked_hunger` (optional) is what it restores
# once cooked, and must be higher. `resource` (optional) links to a map resource in
# data/resources.toml that yields this food (what the harvest yields is in data/jobs.toml).

[[food]]
id = "fish"
name = "Fish"
hunger = 40.0
cooked_hunger = 70.0
resource = "fish_spot"

[[food]]
id = "fruit"
name = "Fruit"
hunger = 30.0
cooked_hunger = 40.0
resource = "fruit_tree"

[[food]]
id = "cabbage"
name = "Cabbage"
hunger = 30.0
cooked_hunger = 45.0
resource = "cabbage"
