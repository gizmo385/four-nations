# Playable civilizations. Modifiers are multipliers on a 1.0 baseline: 2.0 = twice as good/fast.
# Systems should read modifiers through `Modifiers` rather than branching on the nation id, so
# that balance lives here and not in code.
#
# `names` is the pool new units are named from (shuffled per seed).
#
# `starting_techs` are known from tick 0 (ids from data/research.toml). Each must be shared or
# this nation's own, and every prereq of a starting tech must also be a starting tech.

[[nation]]
id = "air"
name = "Air Nomads"
element = "air"
color = [236, 196, 92]
description = "Nomadic monks. Fast and light; can power turbines and mills with airbending."
names = ["Gyatso", "Tashi", "Pasang", "Kunchen", "Jinpa", "Dorje", "Lhamo", "Sonam", "Yangchen", "Kelsang", "Pema", "Iio"]
starting_techs = ["orchards"]
[nation.modifiers]
move_speed = 1.6        # airbenders glide/run
carry_capacity = 0.8
earthworks = 0.7        # digging, levelling, quarrying
heating = 1.0           # smelting, cooking, warmth
water_work = 1.0        # irrigation, fishing, healing
power_generation = 2.0  # turbines, windmills, gliders
construction = 0.9
study = 1.0             # research speed: knowledge per scholar (data/research.toml)

[[nation]]
id = "water"
name = "Water Tribes"
element = "water"
color = [70, 130, 210]
description = "Polar fishers and healers. Irrigate fields, heal the injured, travel by water."
names = ["Kanna", "Pakku", "Hakoda", "Bato", "Yugoda", "Tho", "Kustaa", "Atuat", "Siku", "Nuka", "Malina", "Amaruq"]
starting_techs = ["fishing"]
[nation.modifiers]
move_speed = 1.0
carry_capacity = 1.0
earthworks = 0.9
heating = 0.8
water_work = 2.0
power_generation = 1.0
construction = 1.0
study = 1.0             # research speed: knowledge per scholar (data/research.toml)

