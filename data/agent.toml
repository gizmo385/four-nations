# Limits for fn_agent's embedded script runner (docs/design/agent-scripting.md, "The
# trampoline"). Read by fn_agent only -- fn_sim never reads this file, the same as
# data/tui.toml is fn_tui's own.

[scripts]
# A `run_script` call's own turn budget (20 game seconds each by default) when the caller
# doesn't give one: enough to see whether a new script does anything sane without costing much
# turn budget if it's wrong.
default_turns = 15

# No `run_script` call may ask for more turns than this, whatever `turns` it's given (one game
# year at the default turn length): a proven script still has to come back and let a wake
# report check in.
max_turns = 180

# `Engine::set_max_operations`: a script loop with no `wait` runs away, and this many Rhai
# operations stops it deterministically, before it burns CPU for nothing ("runaway",
# docs/design/agent-scripting.md, "`run_script`").
max_operations = 500000

# How many of the script's own `log`/`print`/`debug` lines a `run_script` result keeps, most
# recent last.
log_tail = 30

# `run_script`'s own `wake_on` when the caller doesn't give one (docs/design/agent-scripting.md,
# "`run_script`"): a death, a need flag first shown, or an endeavor event lands during a `wait`
# ends the script right there with reason "event", rather than running on. Every other event
# kind (arrival, tech, season, stockpile, bend_failed) still shows in `events()` for the script
# to notice and handle on its own.
default_wake = ["death", "need", "endeavor"]

# The `memory` map's own cap, in bytes of its JSON encoding (docs/design/agent-scripting.md,
# "The SDK": "`memory` is a map that persists across runs in a session (8 KB cap)"). A write
# that would exceed this fails the script with a clear error instead of growing without bound.
memory_bytes = 8192

# The `plan` tool's own cap, in bytes of the plan's JSON encoding (docs/design/agent-hillclimb.md,
# "Within a run: a governor and a plan"). The plan is the model's intent held as data, read by
# scripts through `plan()`; a `set` or `merge` that would exceed this fails with a clear error and
# leaves the plan as it was.
plan_bytes = 8192
