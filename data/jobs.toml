# Jobs, items and what the settlers' work yields. Design: docs/design/vision.md (core loop).
#
# The player designates work (chop this tree, quarry this rock, gather this cabbage); a unit
# claims it, walks over, works, and the yield lands on the ground as an item stack. That stack
# becomes a haul job, and a unit carries it to a stockpile zone. Units also act on their own
# needs (data/needs.toml): below a need's `low` level they drop what they're doing, eat, drink
# or sleep, then go back to the job.

[settings]
# How many items one stockpile tile holds (one kind of item per tile).
stockpile_stack = 20
# Items a unit carries in one trip, times its nation's `carry_capacity` modifier (rounded, at
# least 1).
base_carry = 5
# In-game seconds spent eating one item, and taking one drink.
eat_seconds = 3.0
drink_seconds = 2.0
# A sleeping unit wakes at this energy level...
sleep_until = 90.0
# ...or earlier, when hunger or thirst falls below this level and it could do something about it.
sleep_interrupt_below = 10.0
# In-game seconds before a unit with nothing reachable to do looks again.
retry_seconds = 5.0
# A unit with nothing to do stands still for this many seconds, then with this chance wanders
# 1 to `idle_wander_steps` random steps before standing still again. Jobs and needs are looked
# at every tick regardless, so standing costs no latency.
idle_pause_seconds = 8.0
idle_wander_chance = 0.5
idle_wander_steps = 4
# Strain fades this fast, ripe or resting, regardless of difficulty (docs/design/difficulty.md,
# "Strain: tiring land", #296).
strain_recovery_per_minute = 0.05
# With the difficulty preset's strain_kills, a harvest that leaves a tile's strain at or above
# this kills the plant. Hard's always-repicked fruit tree converges on strain ~3.5 (#301's tuning
# pass measured it with the harness); 3.0 is comfortably below that so a tree worked without rest
# reliably dies within a handful of picks, while a tended or rotated one, and fish (equilibrium
# ~1.7) and cabbage (~2.4) even left unrotated, never reach it.
strain_kill_at = 3.0

# Items that aren't food. Foods (data/needs.toml) are items too, with the id they have there.
# `knowledge` (optional, points, at least 1) makes an item readable: it is never stockpiled. A
# unit carries it to a study hall instead, where it is used up and adds that many points to the
# research pool (issue #24). With no study hall to take it, it stays where it lies.
# `stands_for` (optional, an item id) lets this item pay, one for one, any building or endeavor
# cost (and the sign that counts it) that asks for the named item instead -- never a recipe
# input (issue #371: `brick` stands for `stone`, the kiln's purpose). Validated: not itself, no
# chains (the named item can't itself stand in for something), and at most one item may stand in
# for a given target.
[[item]]
id = "wood"
name = "Wood"

[[item]]
id = "stone"
name = "Stone"

[[item]]
id = "gold_ore"
name = "Gold Ore"

[[item]]
id = "ancient_scroll"
name = "Ancient Scroll"
knowledge = 40

# --- Fire production (#124) ---
# Metal, bricks and tools: what the forge, the brick kiln and the smelter turn raw items into
# (each building's `[building.recipe]`, data/buildings.toml). `gold_ore` above doubles as the
# smelter's ore; there's no separate generic "ore" item yet, since gold is the only mineral a
# nation mines today (#132, #133). `metal` is also what Earth's Metalbend (#134, `Effect::Smelt`,
# data/bending.toml) produces directly from a pile of ore, without a smelter.
[[item]]
id = "metal"
name = "Metal"

[[item]]
id = "brick"
name = "Brick"
stands_for = "stone"

[[item]]
id = "tool"
name = "Tool"

# What a Workshop makes once `trade_wares` is known (#708): a plain stored item that caravans
# take in deals (#711).
[[item]]
id = "wares"
name = "Wares"

# --- Water Tribe: ice (#364) ---
# Water's own building material: Cut Ice (`Effect::DrawItem`, data/bending.toml) freezes and
# cuts a river, lake or sea tile beside the bender into it. There's no harvest entry for it,
# since it comes from bending, not a map resource. The igloo costs it instead of wood.
[[item]]
id = "ice"
name = "Ice"

# --- Herbalism (shared, #390) ---
# Grown in an Herb Garden (`[building.farm]`, data/buildings.toml), not foraged: no harvest entry
# here, so a hungry unit never eats one on its own, the way it would a wild cabbage. Not a food
# (data/needs.toml has no `[[food]]` entry for it): `[[remedy]]` in data/harm.toml is what gives
# it a job -- a hurt or sick settler fetches one from stores and takes it like a meal
# (`World::plan_remedy`, docs/design/harm.md "Healing: a job for each feature").
[[item]]
id = "herbs"
name = "Herbs"

# --- The Archive (issue #709) ---
# What scribing makes. A plain stored item: no `knowledge`, so it is never read and never counts
# toward the scrolls sign; caravans take it (#711).
[[item]]
id = "scroll_copy"
name = "Scroll Copy"

# What working a map resource yields. When the work finishes `count` of `item` drops beside the
# resource, and the resource is cleared unless it regrows (see `regrow`).
# - verb:     what the designation is called in the UI.
# - noun, noun_many: optional. What the resource is called after a count in a tool's preview
#             ("7 trees to chop", "3 rock to mine"): `noun` for one, `noun_many` for any other
#             number. Resources that share a noun and a verb are counted together. Without them
#             the resource's own name, lower case, and that with an "s".
# - work:     in-game seconds of work for a unit whose modifier is 1.0.
# - modifier: optional nation modifier (data/nations.toml) that scales how fast the work goes,
#             e.g. quarrying runs on `earthworks`.
# - regrow:   optional, in-game seconds. A renewable resource is not cleared by harvesting: it
#             stays on the map, can't be worked again until it has regrown, and then ripens
#             again. This is what keeps a settlement fed past the first few hours. Without it
#             the resource is used up.
# - tunnel_count: optional, more than `count`. What one harvest yields instead when a tunnel
#             (Earth's Bore Tunnel, data/bending.toml) touches the resource's tile, any of its 8
#             neighbours: the vein is mined from inside the mountain (issue #132,
#             docs/design/research.md, "Tunneling"). Without it tunnels make no difference.
# - frost_hardy: optional, needs `regrow`. Skips the first frost of winter and grows at a flat
#             `hardy_winter_growth` (data/seasons.toml) in every climate band instead of the
#             season or climate factor (docs/design/difficulty.md, "Seasons", #295). Only
#             fishing has this: ice fishing keeps working through winter everywhere.
# - strain:   optional, at least 0, needs `regrow` if above 0. Strain this harvest adds to its
#             tile per pick, times the difficulty preset's `strain` knob
#             (docs/design/difficulty.md, "Strain: tiring land", #296): 0 (the default) means
#             the plant never tires.
# - risk:     optional, in [0, 1), default 0. The chance that finishing one pick of this harvest
#             injures the worker (felling, quarrying, mining; docs/design/harm.md, "Injury: heavy
#             work", issue #388). The chance actually rolled is `risk` divided by the harvest's
#             own `modifier` (earthworks for stone and ore; no modifier means divided by 1), so
#             Earth's earthworks lowers it and Air's weaker one raises it. Drawn once per
#             finished pick, from `rng::stream(seed, "harm.injury")`, only while the difficulty
#             preset's `harm` knob is above 0 (`data/harm.toml`'s `[injury] damage`); a unit below
#             `[settings] fit_for_heavy` doesn't claim a harvest with `risk` at all.
# Which tech, if any, must be known before a resource's designation is available is
# `[tech.unlocks] jobs` in data/research.toml (issue #22): until the nation knows it, the
# resource can't be designated, and hungry units won't forage it either.
# A harvest whose item is a food can also be foraged by a hungry unit on its own.
#
# [harvest.clear] (docs/design/clearing.md, issue #411/#424): how the Clear designation removes
# this resource for good instead of merely working it, for a renewable harvest (one with
# `regrow`) that would otherwise leave the plant standing. Validated: only on a harvest with
# `regrow`, `work` above 0, `item` known (and `count` only together with it). A renewable with no
# `[harvest.clear]` (fish spots) can't be cleared at all. A non-renewable needs none of this: its
# Clear job is just its ordinary harvest, which already removes it.
# - work:  in-game seconds of work, at a flat rate of 1.0 (no modifier of its own).
# - item:  optional. What the clear drops, beside the plant's own ripe yield if it isn't resting.
# - count: how many of `item` it drops. Only together with `item`.
# - risk:  optional, in [0, 1), default 0. Exactly `risk` above (the existing `harm.injury`
#          stream), but with no modifier to scale it.

# count lowered 4 -> 3 by #353 (docs/design/materials.md section 5): wood piled into the
# thousands with nothing to spend it on; a smaller yield keeps wood easy without it being free.
[[harvest]]
resource = "oak_tree"
verb = "Chop"
noun = "tree"
item = "wood"
count = 3
work = 8.0
risk = 0.01

[[harvest]]
resource = "fir_tree"
verb = "Chop"
noun = "tree"
item = "wood"
count = 3
work = 8.0
risk = 0.01

# count and tunnel_count raised by #349 (docs/design/materials.md, section 2): the #348 survey's
# reachable counts ran well under the doc's own trial, so outcrops ended up richer than the doc's
# starting numbers (5 / 8) to actually clear the 200-stone sign within 20 tiles at the median
# (seeds 1-8, Small; see `balance --supply`).
[[harvest]]
resource = "stone"
verb = "Quarry"
noun = "rock"
noun_many = "rock"
item = "stone"
count = 10
work = 12.0
modifier = "earthworks"
tunnel_count = 14
risk = 0.02

# count and tunnel_count raised by #349 (docs/design/materials.md, section 1): a surface vein
# alone couldn't reach the 40-ore sign on any seed (median 13 ore stripping the whole map).
[[harvest]]
resource = "gold_vein"
verb = "Mine"
noun = "rock"
noun_many = "rock"
item = "gold_ore"
count = 3
work = 30.0
modifier = "earthworks"
tunnel_count = 5
risk = 0.03

# Foothill boulders (#349, docs/design/materials.md, section 2): open land, no tunnel bonus since
# a boulder isn't rock to bore into. count raised above the doc's starting 3 alongside stone's
# count above, for the same reason (the real survey's reachable counts run short of the trial's).
[[harvest]]
resource = "boulder"
verb = "Quarry"
noun = "rock"
noun_many = "rock"
item = "stone"
count = 6
work = 10.0
modifier = "earthworks"
risk = 0.02

# A buried seam (#133) is found by Seismic Sense; #349 brought the surface vein above up to the
# same yield, so a seam's edge over a vein is in who can reach it (Earth only), not how rich it is.
[[harvest]]
resource = "gold_seam"
verb = "Mine"
noun = "rock"
noun_many = "rock"
item = "gold_ore"
count = 3
work = 45.0
modifier = "earthworks"
tunnel_count = 5
risk = 0.03

# Picking a scroll up is quick; the point is finding it. Not renewable: each is read once.
[[harvest]]
resource = "ancient_scroll"
verb = "Recover"
item = "ancient_scroll"
count = 1
work = 4.0

[[harvest]]
resource = "cabbage"
verb = "Gather"
noun = "plant"
item = "cabbage"
count = 1
work = 2.0
regrow = 480.0
strain = 1.0

# Pulling up a cabbage patch (#411): quick, and nothing but its crop when ripe.
[harvest.clear]
work = 1.0

[[harvest]]
resource = "fruit_tree"
verb = "Pick"
noun = "plant"
item = "fruit"
count = 2
work = 4.0
regrow = 360.0
strain = 1.0

# Uprooting (#411): a little wood, plus the fruit if it's ripe. 6s is between picking (4s) and
# felling an oak (8s); 2 wood is half an oak's yield, for a smaller tree; the risk matches
# chopping.
[harvest.clear]
work = 6.0
item = "wood"
count = 2
risk = 0.01

# Fishing is slow work, and the water-working nations are good at it.
[[harvest]]
resource = "fish_spot"
verb = "Fish"
item = "fish"
count = 2
work = 8.0
modifier = "water_work"
regrow = 300.0
frost_hardy = true
strain = 0.5

# --- #197 (Air: gliders) -----------------------------------------------------------------------

# Lost ruins (#197) are spotted by gliding and hold a few scrolls: a better find than one in the
# wastes, for the trip. Not renewable.
[[harvest]]
resource = "lost_ruins"
verb = "Search"
noun = "ruin"
noun_many = "ruins"
item = "ancient_scroll"
count = 2
work = 20.0

# --- #727 (Water: southern_ways) ---------------------------------------------------------------

# Shore fishing, read only while `shore_fishing` is known: a Fish order on any of these water
# tiles with a walkable neighbour, not only on a fish spot. The fisher stands on the neighbour.
# It never depletes and never rests, so a standing order keeps it going.
[shore_fishing]
item = "fish"
count = 1
work = 30.0                       # at water_work 1.0; Water's branch makes it about 10 s
modifier = "water_work"
terrains = ["water", "lake", "river", "canal"]
frost_hardy = true

# --- #736 (research horizons phase 5: great ruins) ---------------------------------------------

# A great ruin (#736, docs/design/horizons-phase-5.md, "Searching one") holds the lost ruin's two
# scrolls, so the scrolls sign loses nothing, plus a teaching scroll. Twice a lost ruin's work.
[[harvest]]
resource = "great_ruins"
verb = "Search"
noun = "great ruin"
noun_many = "great ruins"
item = "ancient_scroll"
count = 2
work = 40.0
also = [{ item = "teaching_scroll", count = 1 }]

# Read at a study hall, it opens the teaching draft (#737): two teachings are offered, the player
# keeps one and the other is lost. Readable like an ancient scroll, so never stockpiled.
[[item]]
id = "teaching_scroll"
name = "Teaching Scroll"
reveals = 2
