# Seasons, climate bands, frost and cold (docs/design/difficulty.md, "Seasons", issue #295).
# Read by `Defs::with_seasons`, the way `difficulty.toml` is. None of this does anything unless
# the chosen difficulty preset's `seasons` flag is on (data/difficulty.toml); with it off, or no
# preset at all, the world plays exactly as it did before this file existed.
#
# [calendar]:
# - season_minutes:          in-game minutes in one season; a year is four of them.
# - winter_warning_minutes:  how long before winter the "winter is coming" alert fires.
# - hardy_winter_growth:     growth factor a `frost_hardy` harvest (data/jobs.toml; fishing)
#                            uses in winter, in every climate band, instead of the season or
#                            climate factor below.
#
# [[season]], in calendar order (four, exactly one `winter = true`):
# - id, name:   identifies the season and what the TUI calls it.
# - growth:     multiplies `World::growth_rate`'s season factor. Required for every season
#               except winter, whose growth instead comes from the tile's climate band.
# - winter:     marks the one season frost strikes in and cold applies through.
#
# [[climate]], ascending `max_temperature` to 1.0 (`World::climate_at` picks the first band, in
# file order, whose `max_temperature` reaches a tile's quantized mapgen temperature):
# - id, name:        identifies the band and what the TUI/embark report call it.
# - max_temperature: the top of this band's temperature range, in (0, 1].
# - winter_growth:   growth factor in winter, before `winter_severity` scales it toward 1.0 as
#                    `1 - (1 - winter_growth) * winter_severity`.
# - frost:           does the first frost of winter strike a ripe, non-`frost_hardy` wild plant
#                    here (sends it back to resting for its full regrow time)?
# - cold:            does a unit standing here in winter, with no heat source in reach, feel the
#                    cold ([cold] below, scaled the same way as winter_growth)?
# - outlook_points:  added to a site's outlook (the embark report, #297) when the chosen
#                    difficulty preset has seasons on, times `winter_severity` and rounded. 0
#                    (the default) means the band never makes a site's outlook harder on its own.
#
# [cold]: how much faster a cold unit's needs move, before `winter_severity` scales each toward
# 1.0 the same way winter_growth is. Cold never touches health directly.
# - energy_decay, hunger_decay:  multiply decay while awake.
# - sleep:                       how much slower (below 1.0) energy is regained asleep, unless
#                                heated or in a bed whose own `sleep_bonus` is above 1.0 (the
#                                igloo).

[calendar]
season_minutes = 15.0
winter_warning_minutes = 3.0
hardy_winter_growth = 0.5

[[season]]
id = "spring"
name = "Spring"
growth = 1.25

[[season]]
id = "summer"
name = "Summer"
growth = 1.0

[[season]]
id = "autumn"
name = "Autumn"
growth = 0.75

[[season]]
id = "winter"
name = "Winter"
winter = true

[[climate]]
id = "polar"
name = "Polar"
max_temperature = 0.28
winter_growth = 0.0
frost = true
cold = true
outlook_points = 2

[[climate]]
id = "cool"
name = "Cool"
max_temperature = 0.45
winter_growth = 0.1
frost = true
cold = true
outlook_points = 1

[[climate]]
id = "temperate"
name = "Temperate"
max_temperature = 0.70
winter_growth = 0.3
frost = true
cold = false
outlook_points = 0

[[climate]]
id = "warm"
name = "Warm"
max_temperature = 1.0
winter_growth = 0.6
frost = false
cold = false
outlook_points = 0

[cold]
energy_decay = 1.5
hunger_decay = 1.25
sleep = 0.5

# Earth's sheltered rings (docs/design/horizons-phase-4.md, `agrarian_ring`, #721), read only
# while `sheltered_rings` is known: a closed ring of these finished buildings shelters the tiles
# inside. Mountains and water never close a ring (#716).
[enclosure]
walls = ["earth_wall", "ring_gate"]   # finished buildings that close a ring
winter_growth = 0.75                  # replaces the climate band's, unscaled: the Hothouse's number
frost = false                         # the first frost spares ripe crops inside
cold = false                          # no unit inside is cold, so there is no exposure

# Celestial days (docs/design/horizons-phase-6.md, "Celestial days", #760), read only while
# `celestial_days` (the `star_charts` tech) is known, whatever the difficulty preset's `seasons`
# flag: the calendar runs either way. Each nation has one day a year, in its own season.
#
# [celestial]:
# - warning_minutes:  how long before a day its `CelestialWarning` alert fires.
#
# [[celestial_day]]:
# - id, name:   identifies the day and what the TUI calls it.
# - nation:     whose residents it is for (guests and beasts never are). One day per nation.
# - season:     a [[season]] id.
# - at_minutes: into that season when the day begins; at_minutes + minutes fits in the season.
# - minutes:    how long it lasts, 1 to the season's length. Provisional.
# - refill:     0 to 1. As the day begins, each such unit's chi is raised to at least this share
#               of its meter. Provisional.
# - chi_regen:  1 to 4. Multiplies the unit's chi regen, awake or asleep, while the day lasts.

[celestial]
warning_minutes = 2.0

[[celestial_day]]
id = "equinox_winds"
name = "The equinox winds"
nation = "air"
season = "spring"
at_minutes = 5.0
minutes = 5.0
refill = 1.0
chi_regen = 2.0

[[celestial_day]]
id = "summer_solstice"
name = "The summer solstice"
nation = "fire"
season = "summer"
at_minutes = 5.0
minutes = 5.0
refill = 1.0
chi_regen = 2.0

[[celestial_day]]
id = "harvest_moon"
name = "The harvest moon"
nation = "water"
season = "autumn"
at_minutes = 5.0
minutes = 5.0
refill = 1.0
chi_regen = 2.0

[[celestial_day]]
id = "deep_earth_day"
name = "The deep-earth day"
nation = "earth"
season = "winter"
at_minutes = 5.0
minutes = 5.0
refill = 1.0
chi_regen = 2.0
