# Harm: the rules every source of damage beyond neglect shares (docs/design/harm.md, issue
# #387), and the settings its first source, exposure, needs. Read by `Defs::with_harm`, the way
# `seasons.toml` is read by `with_seasons`. None of this does anything unless the chosen
# difficulty preset's `harm` knob is above 0 (data/difficulty.toml); with it at 0 (Sandbox), or
# no preset at all, the world plays exactly as it did before this file existed.
#
# [settings]:
# - floor:           with the preset's `harm_kills` off, harm never takes a unit's health below
#                    this (`World::apply_exposure`). The need damage `data/needs.toml`'s
#                    `health.depleted_damage_per_minute` already applies isn't floored: a death
#                    still needs an empty need unless `harm_kills` is on.
# - fit_for_heavy:   below this health, a unit claims no harvest marked `risk` (issue #388,
#                    `World::fit_for_heavy_work`).
#
# [exposure]:
# - damage_per_minute: health lost a minute, times the preset's `harm`, while a unit is asleep
#                      on a cold tile (`World::is_cold`) not sheltered by a bed whose own
#                      `sleep_bonus` beats the cold (a heat source -- a campfire, Hearthflame,
#                      Inner Fire, an igloo, Earth Tent or Air Shield -- already rules a tile out
#                      of `is_cold`, so this only ever matters for a plain bed or no shelter at
#                      all).
#
# [injury] (issue #388, docs/design/harm.md "Injury: heavy work"):
# - damage: health lost on a hit, times the preset's `harm`, subject to `[settings] floor`. The
#           chance of a hit is a harvest's own `risk` (data/jobs.toml) divided by its `modifier`
#           (earthworks for stone and ore; no modifier means divided by 1), rolled once per
#           finished pick from `rng::stream(seed, "harm.injury")`.
#
# [sickness] (issue #389, docs/design/harm.md "Sickness: sea water"):
# - minutes:             how long a sickness lasts once caught, with no natural regen the whole
#                        time (`World::apply_sickness`). Ends on its own at `Unit::sick_until`.
# - damage_per_minute:   health lost a minute while sick, times the preset's `harm`.
# - fresh_detour:        path tiles a thirsty unit's `plan_drink` will walk past the nearest
#                        drinking spot of any kind to reach one beside fresh water (a river,
#                        lake or ford) instead. Only while the preset's `harm` is above 0; a
#                        `difficulty == None` world paths exactly as it did before this file
#                        existed.
#
# [[sickness.water]]: a drink taken at a spot whose *only* water neighbours are terrains listed
# here rolls the highest `chance` among them, from `rng::stream(seed, "harm.sickness")`, on a
# hit setting `Unit::sick_until`. A spot with any unlisted (fresh) water neighbour never rolls.
# Every `terrain` here must be one of `Terrain::is_water`'s own (sea, river, lake or ford).
# - terrain, chance

[settings]
floor = 10.0
fit_for_heavy = 80.0

[exposure]
damage_per_minute = 4.0

[injury]
damage = 40.0

[sickness]
minutes = 12.0
damage_per_minute = 3.0
fresh_detour = 15

[[sickness.water]]
terrain = "water"
chance = 0.05
