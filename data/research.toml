buildings = ["tea_house"]

# --- #708 (docs/design/horizons-phase-3.md, "`trade_wares`") -----------------------------------

# The Workshop's second recipe: wares, made of wood, which caravans buy (#711). Not core, so the
# Harmony Gate doesn't grow. It waits for the "Known on the road" chapter, so it can't be
# researched before any caravan has come to buy.
[[tech]]
id = "trade_wares"
name = "Trade Wares"
description = "Carve bowls, boxes and toys that traders pay well for."
cost = 250
prereqs = ["carpentry"]
requires = { chapter = "known_on_the_road" }
[tech.unlocks]
[[tech.unlocks.upgrades]]
building = "workshop"
recipe = "wares"

[[tech]]
