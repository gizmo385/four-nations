# The tech tree. Design and rationale: docs/design/research.md.
#
# - File order must be topological: a tech's prereqs appear before it. `TechId` is the index here.
# - `nation` omitted = shared civilization tier, which every nation can research. With a nation,
#   only that nation sees the tech. Shared techs may only require shared techs; a nation tech may
#   require shared techs and its own nation's techs.
# - `cost` is in knowledge points, > 0. Cost tiers: 25 / 60 / 120 / 250 / 500.
# - `[tech.unlocks]` `modifiers` multiply a nation's modifiers (data/nations.toml) once the tech
#   is known. Each multiplier must be in (0, 4]; unknown modifier names fail to load.
#
# `abilities` lists ids from data/bending.toml that the tech unlocks. An ability can only be
# unlocked by a tech of its own nation, and by at most one tech; an ability no tech unlocks is
# available from the start (a nation's signature ability).
#
# `buildings` lists ids from data/buildings.toml, and `jobs` lists resource ids from
# data/resources.toml whose harvest designation (data/jobs.toml) the tech unlocks (issue #22).
# Either may be unlocked by at most one tech; an item no tech names is available from the start.
#
# Most buildings and jobs in the starter tree below don't exist as data yet. The `# Later:`
# comments record what each tech is meant to unlock once the issue that adds that content wires
# it up (see "Staging" in research.md).

[settings]
passive_knowledge_per_minute = 3.0   # settlement-wide "oral tradition" trickle
study_knowledge_per_minute = 9.0     # per scholar, before the `study` modifier
idle_knowledge_cap = 10.0            # points the pool may hold with no target queued (#284)

# ---------------------------------------------------------------------------------------------
# Shared civilization tier
# ---------------------------------------------------------------------------------------------

[[tech]]
id = "fire_making"
name = "Fire Making"
description = "Keep a flame alive: cook food and stay warm."
cost = 25
# Later: jobs = ["cook"]
[tech.unlocks]
buildings = ["campfire"]

[[tech]]
id = "shelter"
name = "Shelter"
description = "Raise simple huts so people sleep dry and warm."
cost = 25
# Later: buildings = ["hut"]

[[tech]]
id = "fishing"
name = "Fishing"
description = "Nets, lines and the patience to use them."
cost = 25
[tech.unlocks]
jobs = ["fish_spot"]

[[tech]]
id = "stoneworking"
name = "Stoneworking"
description = "Split and shape stone from the land."
cost = 25
# boulder added by #349 (docs/design/materials.md, section 2): a foothill boulder is worked the
# same as an outcrop, under the same tech.
[tech.unlocks]
jobs = ["stone", "boulder"]

[[tech]]
id = "farming"
name = "Farming"
description = "Sow seed in tilled plots and harvest what grows."
cost = 60
# Unlocks the farm plot (issue #198, docs/design/research.md, "Farm plots"): sowing and
# reaping are their own job kinds, not resource harvests, so they aren't `unlocks.jobs`.
[tech.unlocks]
buildings = ["farm_plot"]

[[tech]]
id = "pottery"
name = "Pottery"
description = "Fire clay into pots for storing water and grain."
cost = 60
prereqs = ["fire_making"]
# Later: buildings = ["kiln", "granary"], pots

[[tech]]
id = "carpentry"
name = "Carpentry"
description = "Saws, joints and the workbench: build in wood."
cost = 60
prereqs = ["shelter"]
# The workbench: a shared Workshop makes tools from wood (issue #369,
# docs/design/nation-buildings.md, "Tools").
[tech.unlocks]
buildings = ["workshop"]
modifiers = { construction = 1.1 }

[[tech]]
id = "masonry"
name = "Masonry"
description = "Dress stone and mortar it into lasting walls."
cost = 120
prereqs = ["stoneworking", "carpentry"]
# Later: stone buildings
[tech.unlocks]
modifiers = { construction = 1.15 }

[[tech]]
id = "herbalism"
name = "Herbalism"
description = "Know which plants soothe and which ones heal."
cost = 120
prereqs = ["farming"]
# The Herb Garden (issue #390, docs/design/harm.md "Healing: a job for each feature"): grows
# herbs the way a farm plot grows cabbage; a hurt or sick settler fetches one from stores on its
# own, like a meal (`[[remedy]]`, data/harm.toml, `World::plan_remedy`).
[tech.unlocks]
buildings = ["herb_garden"]
# Later: jobs = ["herbalist"]

[[tech]]
id = "writing"
name = "Writing"
description = "Set knowledge down in scrolls so it outlives the teller."
cost = 120
prereqs = ["pottery"]
# Later: +2 study hall seats
[tech.unlocks]
modifiers = { study = 1.25 }

[[tech]]
id = "prospecting"
name = "Prospecting"
description = "Read the colour and weight of rock to know where gold hides."
cost = 250
prereqs = ["stoneworking"]
# Gates gold mining the same way stoneworking gates stone (#383, docs/design/materials.md):
# #379 found that gold_vein's density and yield couldn't move the ore sign's timing on their
# own, because nothing delayed *when* mining could start. Placed here, near the end of the
# shared tier (after writing, before cartography), so the ore sign lands in year 1 to 2 under
# the economy opening (#352), which researches the whole visible tree in file order; every
# nation, Earth included, needs it the same way every nation needs stoneworking for stone.
[tech.unlocks]
jobs = ["gold_vein", "gold_seam"]

[[tech]]
id = "cartography"
name = "Cartography"
description = "Map the lands around the settlement."
cost = 250
prereqs = ["writing"]
# Unlocks the Map Room (issue #402, docs/design/cartography.md): a settler holding its Chart
# job slowly uncovers the nearest lost ruin the settlement hasn't found yet, nearest reachable
# one first.
[tech.unlocks]
buildings = ["map_room"]

# ---------------------------------------------------------------------------------------------
# Earth Kingdom: shaping the land
# ---------------------------------------------------------------------------------------------

[[tech]]
id = "earth_shaping"
name = "Earth Shaping"
description = "Level and raise the ground with earthbending."
nation = "earth"
cost = 60
prereqs = ["stoneworking"]
# Raise Earth, the nation's signature ability, is available from the start and earthworks scales
# its channel time, so this tech makes fords faster (bending.md). A separate level/raise-terrain
# designation is future work. It also unlocks Earth Tent (#362, docs/design/bending.md "More
# abilities and the route to mastery"): a stone shelter that keeps sleepers warm far from a fire.
[tech.unlocks]
modifiers = { earthworks = 1.2 }
abilities = ["earth_tent"]

[[tech]]
id = "earthen_walls"
name = "Earthen Walls"
description = "Raise walls and flood barriers straight from the ground."
nation = "earth"
cost = 120
prereqs = ["earth_shaping", "masonry"]
# Later: buildings = ["flood_barrier", "terrace"] once something gives them a job to do (#136)
[tech.unlocks]
buildings = ["earth_wall"]
modifiers = { construction = 1.25 }

[[tech]]
id = "tunneling"
name = "Tunneling"
description = "Bore tunnels through mountains and mine inside them."
nation = "earth"
cost = 120
prereqs = ["earth_shaping"]
# Unlocks Bore Tunnel (#132, docs/design/research.md, "Tunneling"): a bend that turns a mountain
# tile into a walkable tunnel. Minerals touching a tunnel yield their harvest's `tunnel_count`
# (data/jobs.toml). `tunneling` itself gates neither mining job: stone needs stoneworking, gold
# needs prospecting (#383), the same for every nation. Also unlocks the Mine Shaft (#373,
# docs/design/nation-buildings.md): a miner cuts stone from the rock a shaft is built against,
# instead of walking out to a deposit.
[tech.unlocks]
abilities = ["bore_tunnel"]
buildings = ["mine_shaft"]

[[tech]]
id = "earth_rail"
name = "Earth Rail"
description = "Stone carts pushed along rails by earthbenders, as in Ba Sing Se."
nation = "earth"
cost = 250
prereqs = ["earthen_walls"]
# Unlocks the rail building (#135, docs/design/research.md): carts run along a line of it. Being
# Earth's own tech is what makes rail Earth's: nothing else in the code asks which nation.
[tech.unlocks]
buildings = ["rail"]
modifiers = { carry_capacity = 1.25 }

[[tech]]
id = "seismic_sense"
name = "Seismic Sense"
description = "Feel vibrations through the earth to find what lies beneath."
nation = "earth"
cost = 250
prereqs = ["tunneling"]
# Unlocks Seismic Sense (#133, docs/design/research.md, "Seismic sense"): a bend that uncovers the
# gold seams buried in the rock within a radius (data/resources.toml, `buried`).
[tech.unlocks]
abilities = ["seismic_sense"]

[[tech]]
id = "metalbending"
name = "Metalbending"
description = "Bend the earth still left in metal."
nation = "earth"
cost = 500
prereqs = ["seismic_sense", "masonry"]
# Unlocks Metalbend (#134, docs/design/research.md, "Metalbending"): ore straight into metal, in
# place, no smelter trip needed. Also unlocks the Deep Mine (#373, docs/design/
# nation-buildings.md): metal braces a shaft deep enough to reach gold, Metalbend's economic use.
[tech.unlocks]
abilities = ["metalbend"]
buildings = ["deep_mine"]

# ---------------------------------------------------------------------------------------------
# Fire Nation: heat and industry
# ---------------------------------------------------------------------------------------------

[[tech]]
id = "forging"
name = "Forging"
description = "Work hot metal into tools at the forge."
nation = "fire"
cost = 60
prereqs = ["fire_making"]
# The smith job (#124) isn't a `jobs` unlock: that list names harvestable resources, and
# smithing isn't one. It's gated behind this tech structurally instead: the forge is, and the
# forge is where the job lives (`world/forge.rs` opens its craft job the moment one is built, the
# way a study hall's seats open).
# Ability: Weld (#363, docs/design/bending.md, "More abilities and the route to mastery"): Fire's
# early second form, something to bend before Dancing Dragon besides Hearthflame.
[tech.unlocks]
buildings = ["forge"]
abilities = ["weld"]

[[tech]]
id = "brickmaking"
name = "Brickmaking"
description = "Fire bricks by the thousand for strong, quick building."
nation = "fire"
cost = 120
prereqs = ["forging", "pottery"]
[tech.unlocks]
buildings = ["brick_kiln"]
modifiers = { construction = 1.15 }

[[tech]]
id = "smelting"
name = "Smelting"
description = "Draw metal out of ore with steady firebending heat."
nation = "fire"
cost = 120
prereqs = ["forging"]
[tech.unlocks]
buildings = ["smelter"]
modifiers = { heating = 1.2 }

[[tech]]
id = "dancing_dragon"
name = "Dancing Dragon"
description = "The Sun Warriors' teaching: fire is life and energy, not rage."
nation = "fire"
cost = 250
prereqs = ["smelting"]
[tech.unlocks]
abilities = ["inner_fire"]
modifiers = { heating = 1.25 }

[[tech]]
id = "steam_engines"
name = "Steam Engines"
description = "Boil water to drive mills and pumps."
nation = "fire"
cost = 250
prereqs = ["smelting", "brickmaking"]
[tech.unlocks]
buildings = ["steam_engine"]
modifiers = { power_generation = 1.25 }

[[tech]]
id = "lightning_generation"
name = "Lightning Generation"
description = "Firebenders feed lightning into a power station, Republic City style."
nation = "fire"
cost = 500
prereqs = ["dancing_dragon", "steam_engines"]
[tech.unlocks]
buildings = ["lightning_station"]
modifiers = { power_generation = 1.5 }

# ---------------------------------------------------------------------------------------------
# Water Tribes: flow and healing
# ---------------------------------------------------------------------------------------------

[[tech]]
id = "irrigation"
name = "Irrigation"
description = "Bend water along channels so nearby crops grow faster."
nation = "water"
cost = 60
prereqs = ["farming"]
# The irrigation channel (issue #126): farm plots within its reach grow faster
# (`World::crop_growth_rate`, world/farm.rs).
# Ability: Draw Water (#364, docs/design/bending.md, "More abilities and the route to mastery"):
# a temporary pool on dry land, away from any river, that drains back into the ground on its own.
[tech.unlocks]
buildings = ["irrigation_channel"]
abilities = ["draw_water"]
modifiers = { water_work = 1.15 }

[[tech]]
id = "ice_construction"
name = "Ice Construction"
description = "Cut and bend ice into a cheap, sturdy building material."
nation = "water"
cost = 120
prereqs = ["shelter"]
# Ability: Cut Ice (#364, docs/design/bending.md, "More abilities and the route to mastery"):
# freezes and cuts river, lake or sea water into Water's own building material. The igloo
# costs it instead of wood.
[tech.unlocks]
buildings = ["igloo"]
abilities = ["cut_ice"]

[[tech]]
id = "healing"
name = "Healing"
description = "Guide the body's own energy with water to mend wounds."
nation = "water"
cost = 120
prereqs = ["herbalism"]
# The Healing Hut (issue #375, narrowing #125): hurt settlers rest and mend there. The healer
# job and the Healing Water ability still need a bending mechanic (#358).
[tech.unlocks]
buildings = ["healing_hut"]

[[tech]]
id = "tide_mills"
name = "Tide Mills"
description = "Push and pull the tide to turn coastal mills."
nation = "water"
cost = 250
prereqs = ["irrigation"]
# The Tide Mill (issue #200, docs/design/power.md): Water's first power source, built on the
# bank. Also raises `power_generation` to 1.25, which widens the mill's own reach to 5 tiles.
[tech.unlocks]
buildings = ["tide_mill"]
modifiers = { power_generation = 1.25 }

[[tech]]
id = "water_travel"
name = "Water Travel"
description = "Canoes and ice skiffs carry people across the water."
nation = "water"
cost = 250
prereqs = ["fishing", "ice_construction"]
# The Fishing Dock (issue #374): Water's orchard, on the water. Crossing water tiles itself
# still needs a movement rule (issue #127).
[tech.unlocks]
buildings = ["fishing_dock"]

[[tech]]
id = "spirit_oasis"
name = "Spirit Oasis"
description = "A still pool where push and pull find balance, restoring chi and spirits."
nation = "water"
cost = 500
prereqs = ["healing", "tide_mills"]
# Modifier-only for now: the oasis needs chi and mood regeneration (issue #127).
[tech.unlocks]
modifiers = { water_work = 1.25 }

# ---------------------------------------------------------------------------------------------
# Air Nomads: lightness and spirit
# ---------------------------------------------------------------------------------------------

[[tech]]
id = "orchards"
name = "Orchards"
description = "Plant and tend fruit trees for food that needs no fire."
nation = "air"
cost = 25
# Wild fruit trees stay pickable by every nation (owner decision, #142), so this unlocks only the
# orchard building, which plants and tends new fruit trees (docs/design/research.md, "The
# orchard").
[tech.unlocks]
buildings = ["orchard"]

[[tech]]
id = "meditation"
name = "Meditation"
description = "Quiet the mind; chi flows and lessons come easier."
nation = "air"
cost = 60
# It raises chi regeneration and study speed, and the study hall exists from the start (named
# Meditation Pavilion for Air). It also unlocks Air Shield (#362, docs/design/bending.md "More
# abilities and the route to mastery"): a dome of still air that keeps the cold off a crew
# caught out on cold ground.
[tech.unlocks]
modifiers = { study = 1.2, chi_regen = 1.25 }
abilities = ["air_shield"]

[[tech]]
id = "gliders"
name = "Gliders"
description = "Glider staffs carry airbenders over the land."
nation = "air"
cost = 60
prereqs = ["carpentry"]
# Glider staffs: airbenders move faster, and can Glide to spot lost ruins from above (#197).
[tech.unlocks]
abilities = ["glide"]
modifiers = { move_speed = 1.15 }

[[tech]]
id = "windmills"
name = "Windmills"
description = "Catch the wind to grind grain into more food."
nation = "air"
cost = 120
prereqs = ["gliders", "farming"]
# Later: the windmill grinding grain into more food (issue #142).
# Ability: Lift (#363, docs/design/bending.md, "More abilities and the route to mastery"): Air's
# building and access role, the same lever as Fire's Weld.
[tech.unlocks]
buildings = ["windmill"]
abilities = ["lift"]
modifiers = { power_generation = 1.2 }

[[tech]]
id = "air_scooter"
name = "Air Scooter"
description = "Ride a spinning ball of air."
nation = "air"
cost = 250
prereqs = ["gliders", "meditation"]
# Ability: a burst of speed on the caster (docs/design/bending.md, "Air Nomads: Air Scooter",
# #143).
[tech.unlocks]
abilities = ["air_scooter"]
modifiers = { move_speed = 1.2 }

[[tech]]
id = "wind_turbines"
name = "Wind Turbines"
description = "Airbenders spin turbines that power workshops."
nation = "air"
cost = 250
prereqs = ["windmills"]
# Later: the turbine powering workshops (no power system yet, issue #142).
[tech.unlocks]
buildings = ["wind_turbine"]
modifiers = { power_generation = 1.25 }

[[tech]]
id = "sky_bison"
name = "Sky Bison"
description = "Befriend sky bison to haul loads and fly far."
nation = "air"
cost = 500
prereqs = ["meditation", "air_scooter"]
# Later: bison haul and fast travel (issue #142).
[tech.unlocks]
buildings = ["bison_stable"]
modifiers = { carry_capacity = 1.3 }
