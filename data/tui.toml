# The Avatar (#237, #242): always `@` in white, on the nation's accent instead of the tile's own
# background, so he reads as a guest apart from every nation's own units.
[avatar]
glyph = "@"
ascii = "@"
fg = [255, 255, 255]

# Background tints, mixed into the tile's bg (docs/design/tui.md, "What draws on top"). The bend
# tint is the nation's accent, so it isn't listed.
[overlay]
harvest = [255, 166, 26]
# A harvest with a standing order on it (#277): the same harvest colour pushed toward green so
# it reads as "standing" rather than "one-shot".
repeating = [166, 217, 26]
# A Clear mark (#411/#426): a rust red, apart from the harvest amber and the repeating green.
clear = [178, 90, 60]
stockpile = [51, 140, 255]
build = [150, 130, 200]
wet = [64, 46, 20]
cursor = [250, 220, 60]
# The tiles a lit flame warms, while the cursor is on it.
warm = [150, 70, 24]
# A power source's reach (#428, #429): the cursor on a finished source, or the Build tool
# placing one, the way `warm` shows a flame's reach.
powered = [70, 170, 210]
flame = { glyph = "☼", ascii = "!", fg = [255, 150, 40] }
# A young fruit tree from an orchard (#142), drawn in place of the resource's glyph until it
# first ripens.
sapling = { glyph = "ψ", ascii = "y", fg = [150, 210, 110] }
# A farm plot (#198), drawn in place of its building glyph while growing or ripe.
plot_growing = { glyph = "·", ascii = ",", fg = [120, 200, 90] }
plot_ripe = { glyph = "✶", ascii = "*", fg = [230, 200, 50] }
# Earth Tent and Air Shield (#362): shelters, not flames, so each gets its own look apart from
# the plain `flame` above.
earth_tent = { glyph = "▲", ascii = "t", fg = [168, 140, 90] }
air_shield = { glyph = "○", ascii = "s", fg = [210, 230, 235] }
# A caravan's camp (#438): a 2x2 block of tents, one tile of it the traders themselves (the
# unit glyph). Both draw in the visiting nation's unit colour, so `fg` here is a fallback.
camp = { glyph = "△", ascii = "A", fg = [210, 180, 120] }
# A chute's link line (#683): `:` from its head to its foot, while the head is under the cursor.
link = { glyph = ":", ascii = ":", fg = [220, 220, 200] }

# The embark screen's overview (#290, docs/design/embark.md, "What a cell shows"): presentation
# thresholds for the zoomed-out block classifier, not game rules, so they live here rather than
# data/embark.toml.
[embark]
# The overview's scale is never finer than this many tiles per cell, however big the terminal.
min_overview_scale = 6
# Sea is at least this share of a block's tiles.
sea_share = 0.5
# Mountain is at least this share of a block's tiles.
mountain_share = 0.3333333333333333
# Fresh water (river, lake or ford) is at least this share of N, the block's edge in tiles (so
# the threshold is `max(1, N * river_lake_share)`), at 1:4 and 1:2 only.
river_lake_share = 0.5

# The side panel's Season section (#299, docs/design/difficulty.md "TUI"): presentation, not a
# sim rule, so it lives here rather than data/seasons.toml.
[season]
# Food per head below which, in autumn or winter, the Season section's food line warns: about
# two winter meals each.
winter_food_per_head = 4

# The watcher's studio layout (docs/design/agent-studio.md): presentation only.
[studio]
min_width = 160          # below this (or min_height) the panes become tabs
min_height = 45
game_share = 0.6         # the game column's share of the width, at least
game_min_width = 96
code_max_width = 88      # the code column never grows past this: the game gets the rest
feed_min_rows = 12       # the feed is max(feed_min_rows, height / 4) rows
spark_turns = 24         # sparkline window in the studio
spark_turns_tabs = 10    # and in the tab strip
spark_floor = 4          # acts per turn that fill a bar, at least

# Rhai syntax colours for the studio's code pane, by fn_ui::code::Class.
[code]
keyword = [198, 120, 221]
literal = [209, 154, 102]
number = [209, 154, 102]
string = [152, 195, 121]
comment = [110, 118, 129]
call = [97, 175, 239]
op = [171, 178, 191]
gutter = [92, 99, 112]
added_bg = [30, 60, 34]    # mixed into the line's background
added = [120, 200, 110]    # the ▌ marker
removed = [224, 108, 117]  # the ▁ marker

