ascii = "#"
fg = [176, 160, 120]

[building.rail]
glyph = "╪"
ascii = "="
fg = [160, 164, 176]

# --- Air Nomads ---
[building.orchard]
glyph = "♣"
ascii = "O"
fg = [150, 210, 110]

[building.windmill]
glyph = "✢"
ascii = "W"
fg = [226, 226, 200]

[building.wind_turbine]
glyph = "✣"
ascii = "V"
fg = [190, 220, 240]

[building.bison_stable]
glyph = "∩"
ascii = "S"
fg = [210, 190, 150]

# --- Fire Nation ---
[building.forge]
glyph = "Ω"
ascii = "F"
fg = [232, 96, 48]

[building.brick_kiln]
glyph = "▦"
ascii = "K"
fg = [200, 90, 60]

[building.smelter]
glyph = "Ψ"
ascii = "S"
fg = [240, 130, 50]

[building.steam_engine]
glyph = "Φ"
ascii = "E"
fg = [190, 190, 200]

[building.lightning_station]
