ascii = "T"
fg = [200, 160, 100]

# The gate's site, while it is building, draws as this 4x4 glyph block instead of the generic
# dimmed site (#212, #242): one entry per `data/endeavor.toml` stage id, so the player can tell
# the stage apart at a glance. A stage the data doesn't name here falls back to the generic site.
[gate_stage.foundation]
glyph = "▦"
ascii = ":"
fg = [150, 140, 120]

[gate_stage.pillars]
glyph = "╫"
ascii = "I"
fg = [195, 190, 170]

[gate_stage.arch]
glyph = "Π"
ascii = "A"
fg = [215, 190, 140]

[gate_stage.rite]
glyph = "✦"
ascii = "*"
fg = [255, 230, 150]

# The box-drawing pieces a rail tile or site (`building.rail` above) picks between, by which of
# its four neighbours are rail (#279, mirrors #135's sixteen track pieces). A lone tile (no rail
# neighbour) keeps `building.rail`'s own glyph instead, so there's no entry for that case: index
# `mask - 1` is a bitmask of which neighbours are rail, bit 0 north, bit 1 east, bit 2 south, bit
# 3 west.
[rail_track]
glyph = ["│", "─", "└", "│", "│", "┌", "├", "─", "┘", "─", "┴", "┐", "┤", "┬", "┼"]
ascii = ["|", "-", "+", "|", "|", "+", "+", "-", "+", "-", "+", "+", "+", "+", "+"]

# Units draw in their nation's `color` (data/nations.toml), mixed toward white by `lift`.
[unit]
glyph = "☺"
ascii = "@"
lift = 0.4

# The Avatar (#237, #242): always `@` in white, on the nation's accent instead of the tile's own
# background, so he reads as a guest apart from every nation's own units.
[avatar]
glyph = "@"
ascii = "@"
fg = [255, 255, 255]

# Background tints, mixed into the tile's bg (docs/design/tui.md, "What draws on top"). The bend
# tint is the nation's accent, so it isn't listed.
[overlay]
harvest = [255, 166, 26]
# A harvest with a standing order on it (#277): the same harvest colour pushed toward green so
# it reads as "standing" rather than "one-shot".
repeating = [166, 217, 26]
stockpile = [51, 140, 255]
build = [150, 130, 200]
wet = [64, 46, 20]
cursor = [250, 220, 60]
# The tiles a lit flame warms, while the cursor is on it.
warm = [150, 70, 24]
flame = { glyph = "☼", ascii = "!", fg = [255, 150, 40] }
# A young fruit tree from an orchard (#142), drawn in place of the resource's glyph until it
# first ripens.
sapling = { glyph = "ψ", ascii = "y", fg = [150, 210, 110] }
# A farm plot (#198), drawn in place of its building glyph while growing or ripe.
plot_growing = { glyph = "·", ascii = ",", fg = [120, 200, 90] }
plot_ripe = { glyph = "✶", ascii = "*", fg = [230, 200, 50] }

# The embark screen's overview (#290, docs/design/embark.md, "What a cell shows"): presentation
# thresholds for the zoomed-out block classifier, not game rules, so they live here rather than
# data/embark.toml.
[embark]
# The overview's scale is never finer than this many tiles per cell, however big the terminal.
min_overview_scale = 6
# Sea is at least this share of a block's tiles.
sea_share = 0.5
# Mountain is at least this share of a block's tiles.
mountain_share = 0.3333333333333333
# Fresh water (river, lake or ford) is at least this share of N, the block's edge in tiles (so
# the threshold is `max(1, N * river_lake_share)`), at 1:4 and 1:2 only.
river_lake_share = 0.5

# The side panel's Season section (#299, docs/design/difficulty.md "TUI"): presentation, not a
# sim rule, so it lives here rather than data/seasons.toml.
[season]
# Food per head below which, in autumn or winter, the Season section's food line warns: about
# two winter meals each.
winter_food_per_head = 4
