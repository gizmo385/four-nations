ascii = "*"
fg = [255, 230, 150]

# The box-drawing pieces a rail tile or site (`building.rail` above) picks between, by which of
# its four neighbours are rail (#279, mirrors #135's sixteen track pieces). A lone tile (no rail
# neighbour) keeps `building.rail`'s own glyph instead, so there's no entry for that case: index
# `mask - 1` is a bitmask of which neighbours are rail, bit 0 north, bit 1 east, bit 2 south, bit
# 3 west.
[rail_track]
glyph = ["│", "─", "└", "│", "│", "┌", "├", "─", "┘", "─", "┴", "┐", "┤", "┬", "┼"]
ascii = ["|", "-", "+", "|", "|", "+", "+", "-", "+", "-", "+", "+", "+", "+", "+"]

# Units draw in their nation's `color` (data/nations.toml), mixed toward white by `lift`. Every
# unit already draws bold (crate::map::thing_look); a bending master (#360, #361,
# docs/design/bending.md "Seeing it") stands out further still, mixed closer to white yet by
# `master_lift`, so the player can spot one at a glance.
[unit]
glyph = "☺"
ascii = "@"
lift = 0.4
master_lift = 0.75

# A beast (docs/design/horizons-phase-2.md, "Beasts", #699): one entry per `data/beasts.toml` id,
# which the tests check, so a new beast's row only needs its look here. A beast draws in its own
# colour, never a nation's, and bold like every unit; the selected one is in reverse video.
[beast.sky_bison]
