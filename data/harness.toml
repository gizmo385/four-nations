# --- Forks (horizons-phase-4.md, "Measuring it", #731) ---
# Two runs that must NOT separate too far, per nation: the side that reads lower on `metric` by
# more than `tie` wins a paired seed, and neither side may win more than `max_share` of them.
#
#   a, b        { style, preset }
#   tie         readings within this are a tie (two runs that never got there tie too)
#   max_share   default 0.75
#   minutes     default [panel] minutes
#   nations     only these nations (default: all)
[[fork]]
id = "schools_both_viable"
doc = "horizons-phase-4.md#measuring-it"
# The Foundation, the gate's first stage: the Arch is almost never finished by 300 minutes, so
# stage 3 read "no data" for nearly every pair (owner decision #891, option A).
metric = "stage_minute.1"
a = { style = "school_first", preset = "normal" }
b = { style = "school_second", preset = "normal" }
tie = 5.0
max_share = 0.75
minutes = 300

[[fork]]
id = "schools_both_viable_hard"
doc = "horizons-phase-4.md#measuring-it"
metric = "stage_minute.1"
a = { style = "school_first", preset = "hard" }
b = { style = "school_second", preset = "hard" }
tie = 5.0
max_share = 0.75
minutes = 300
nations = ["earth", "air"]
