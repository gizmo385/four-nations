# Bending: the chi meter and each nation's signature ability.
# Design and rationale: docs/design/bending.md.
#
# `[chi]`: every unit has a chi meter from 0 to `max`. It regenerates per in-game minute (times
# the nation's `chi_regen` modifier in data/nations.toml) and is spent when a bend completes. A
# unit only claims a bend job if its chi covers the cost.
#
# `[[ability]]`: one per ability, in file order (`AbilityId` is the index).
# - `nation`: only this nation can use it. A JOINT bend (#759) names `nations = ["a", "b"]` in its
#   place: exactly two distinct nations, one caster of each channels it together, and a fusion
#   tech of the same two nations must unlock it. It can't have a `speed_modifier`.
# - `chi`: cost, in (0, chi.max]. `work`: channel seconds at a modifier of 1.0, >= 0.
# - `speed_modifier` (optional): a nation modifier (data/nations.toml) that divides the channel
#   time, like a harvest's `modifier`.
# - `magnitude_modifier` (optional): a nation modifier that scales the effect's one documented
#   magnitude (named per kind below).
# - `rank` (optional): "adept" or "master" (never "novice", which needs no gate). Checked by
#   `can_cast` next to the tech `unlocks.abilities` gates below (#360). A signature ability
#   needs neither a tech nor a rank.
# - `[ability.effect]`: `kind` picks one variant of the effect enum in crates/sim/src/bending.rs;
#   unknown keys are rejected. Terrain, biome and resource ids must exist.
# - An ability is available from the start unless a tech lists it under `unlocks.abilities` in
#   data/research.toml (that tech must be of the same nation, or a fusion of a joint bend's two,
#   and the only one to list it).
#
# The four effects landed as separate work (#68 to #71): the magnitude of `irrigate` scales
# `wet_minutes`, that of `heat_source` scales `duration_minutes`, and that of `wind_carry` scales
# `range`. `reshape`'s magnitude (#364) scales `revert_minutes`, when that is set; a `reshape`
# with no `revert_minutes` (Raise Earth, Bore Tunnel) is permanent and needs no magnitude at all.
#
# `[mastery]`: the route from novice to master (docs/design/bending.md, "The route: novice,
# adept, master", #360). A master is `master_bends` finished bends (overridden per nation by
# `master_bends_per_nation`, #344's numbers, unchanged) in at least `master_forms` different
# abilities ("forms": an ability a settler has finished at least one bend of). An adept is
# `adept_share` of its own nation's master-bends threshold (rounded up), in at least
# `adept_forms`. `master_chi` is the share of an ability's own `chi` a master pays for any bend
# (0.8: 80%). `[mastery.titles.<nation>]` names what that nation's settlers are called at each
# rank; every nation needs one.

[chi]
max = 100.0
regen_per_minute = 2.0         # awake
sleep_regen_per_minute = 8.0   # asleep: rest restores chi

# `[canal]` (#695, docs/design/horizons-phase-2.md, "Shared sim work, 4. Canal"): what a tile
# Carve Canal cut does for the fields beside it. Each canal tile speeds up farm plots within
# `irrigation_radius` (Chebyshev) by `growth_boost`; the best boost in reach applies, whether it
# comes from a canal or an Irrigation Channel, and the two don't stack.
[canal]
irrigation_radius = 2
growth_boost = 1.5   # the Irrigation Channel's own boost

[mastery]
master_bends = 10
master_bends_per_nation = { earth = 8, water = 8, air = 16 }
master_forms = 3
adept_share = 0.5
adept_forms = 2
master_chi = 0.8

[mastery.titles.fire]
novice = "Student"
adept = "Firebender"
master = "Firebending Master"

[mastery.titles.earth]
novice = "Student"
adept = "Earthbender"
master = "Earthbending Master"

[mastery.titles.water]
novice = "Student"
adept = "Waterbender"
master = "Waterbending Master"

[mastery.titles.air]
novice = "Initiate"
adept = "Airbender"
master = "Airbending Master"

# Earth: turns a river or lake tile beside dry ground into a permanent, walkable ford.
[[ability]]
id = "raise_earth"
nation = "earth"
name = "Raise Earth"
verb = "Raise stones"
description = "Raise the riverbed into stepping stones."
chi = 50.0
work = 15.0
speed_modifier = "earthworks"
[ability.effect]
kind = "reshape"
from = ["river", "lake"]
to = "ford"

# Water: wets a 3x3 patch near fresh water; when it dries, wild greens sprout there.
[[ability]]
id = "water_the_land"
nation = "water"
name = "Water the Land"
verb = "Water"
description = "Pull water from the river and pour it into the soil. Greens sprout where it wets."
chi = 40.0
work = 10.0
speed_modifier = "water_work"
[ability.effect]
kind = "irrigate"
source_range = 4          # tiles from fresh water (river, lake or ford)
wet_minutes = 6.0
sprouts = 2               # tiles of the patch that sprout when it dries
sprout_resource = "cabbage"
biomes = ["plains", "forest", "swamp"]   # fertile ground
fallow_minutes = 30.0     # a tile that sprouted can't sprout again for this long

# Fire: a fuel-free flame. Meals eaten near it count as cooked, and sleep near it is better.
[[ability]]
id = "hearthflame"
nation = "fire"
name = "Hearthflame"
verb = "Kindle"
description = "A flame that needs no fuel. Meals eaten near it are cooked, and sleep is warmer."
chi = 30.0
work = 4.0
magnitude_modifier = "heating"   # scales duration_minutes
[ability.effect]
kind = "heat_source"
duration_minutes = 8.0
radius = 3                # tiles, Chebyshev
sleep_bonus = 1.5         # energy regained asleep nearby, times the base rate
seek_tiles = 20           # a unit about to sleep walks to a flame within this many path tiles
restoke_below = 0.5       # #359: a restoke is refused while more than half the burn is left

# Air: blows a whole ground stack into a stockpile, over anything.
[[ability]]
id = "wind_carry"
nation = "air"
name = "Wind Carry"
verb = "Blow"
description = "A gust that lifts the load: send a whole stack to a stockpile."
chi = 15.0
work = 2.0
magnitude_modifier = "power_generation"   # scales range
[ability.effect]
kind = "wind_carry"
range = 8                 # tiles, Chebyshev

# Fire, from `dancing_dragon`: a warmth aura on the bender. The designated tile is only where the
# bender stands to channel; the aura goes to whoever channels it and follows them. Meals eaten
# near the carrier are cooked and sleep near them is warmer, but nobody walks to it.
[[ability]]
id = "inner_fire"
nation = "fire"
name = "Inner Fire"
verb = "Kindle within"
description = "Carry a warmth with you. Meals eaten near you are cooked, and sleep is warmer."
chi = 40.0
work = 6.0
magnitude_modifier = "heating"   # scales duration_minutes
[ability.effect]
kind = "heat_aura"
duration_minutes = 4.0
radius = 2                # tiles, Chebyshev, around the carrier
sleep_bonus = 1.25        # energy regained asleep nearby, times the base rate
restoke_below = 0.5       # #359: a recast is refused while more than half the aura is left

# Earth, from `tunneling` (#132, docs/design/research.md, "Tunneling"): bores one tile of tunnel
# into a mountain from open ground or another tunnel beside it, so tunnels grow inward a tile at a
# time. A tunnel is walkable, and a gold vein or stone outcrop touching one is mined from inside
# the rock for its harvest's `tunnel_count` (data/jobs.toml). A tile with a resource on it can't be
# bored: quarry the outcrop first.
[[ability]]
id = "bore_tunnel"
nation = "earth"
name = "Bore Tunnel"
verb = "Bore"
description = "Push the rock aside and open a passage into the mountain."
chi = 40.0
work = 20.0
speed_modifier = "earthworks"
[ability.effect]
kind = "reshape"
from = ["mountain"]
to = "tunnel"

# Earth, from `seismic_sense` (#133, docs/design/research.md, "Seismic sense"): the bender stands
# on open ground (or in a tunnel) and feels through the earth. Every buried resource within
# `radius` tiles (Chebyshev) of that tile is uncovered: a gold seam appears in the rock, to be
# mined (or tunnelled to) like any vein. Finding nothing still spends the chi.
[[ability]]
id = "seismic_sense"
nation = "earth"
name = "Seismic Sense"
verb = "Sense"
description = "Feel the earth's vibrations to find what lies buried in the rock."
chi = 30.0
work = 6.0
speed_modifier = "earthworks"
[ability.effect]
kind = "reveal"
radius = 8                # tiles, Chebyshev
finds = ["gold_seam"]     # what it can feel: buried resources only

# --- #197 (Air: gliders) -----------------------------------------------------------------------

# Air, from `gliders` (#197, docs/design/research.md, "Gliders"): the bender takes off from open
# ground and circles on the wind. Every lost ruin within `radius` tiles (Chebyshev) of that tile
# is spotted from above and appears on the map, to be searched for scrolls. Seen from the air, it
# reaches much further than Earth's sense, but only ruins: the rock keeps its seams.
[[ability]]
id = "glide"
nation = "air"
name = "Glide"
verb = "Glide"
description = "Soar on a glider staff and spot the ruins hidden in the land below."
chi = 40.0
work = 8.0
[ability.effect]
kind = "reveal"
radius = 14               # tiles, Chebyshev
finds = ["lost_ruins", "great_ruins"]

# --- #143 (Air: air scooter) -------------------------------------------------------------------

# Air, from `air_scooter` (#143, docs/design/bending.md, "Air Nomads: Air Scooter"): the bender
# steps onto a spinning ball of air and rides it, much faster than on foot, for a little while.
# The burst ends with its timer, not with distance covered, so a long haul might outrun it partway
# there. It's a self-cast like Inner Fire: the designated tile is only where the bender stands to
# summon it.
[[ability]]
id = "air_scooter"
nation = "air"
name = "Air Scooter"
verb = "Ride"
description = "Spin up a ball of air and ride it, much faster than on foot, for a little while."
chi = 20.0
work = 3.0
magnitude_modifier = "move_speed"   # scales duration_minutes: already-fast nations ride it longer
[ability.effect]
kind = "scooter"
duration_minutes = 2.0
multiplier = 2.5

# --- #134 (Earth: metalbending) -----------------------------------------------------------------

# Earth, from `metalbending` (docs/design/research.md, "Metalbending"): the bender reaches into a
# pile of ore and draws the metal straight out of it, in place -- the same conversion the Fire
# Nation's smelter does (data/buildings.toml's `smelter`), but with no building, no haul to one
# and no steady batches, at the cost of chi and a channel instead. `ratio` matches the smelter's:
# 2 ore for 1 metal. Any ore left over once the pile divides by `ratio` stays behind, as ore.
[[ability]]
id = "metalbend"
nation = "earth"
name = "Metalbend"
verb = "Bend"
description = "Draw the metal straight out of a pile of ore, no forge needed."
chi = 35.0
work = 12.0
speed_modifier = "earthworks"
[ability.effect]
kind = "smelt"
ore = "gold_ore"
metal = "metal"
ratio = 2

# --- #362 (Earth: Earth Tent, Air: Air Shield) ---------------------------------------------------

# Earth, from `earth_shaping` (docs/design/bending.md, "More abilities and the route to
# mastery"): Toph's tent, a stone shelter raised wherever a crew works far from a fire. Sleepers
# within its radius get its own sleep_bonus and stay warm, same as a flame, but it kindles
# nothing: `cooks = false` means a meal eaten nearby stays raw. It isn't a bed (it's a tile
# effect, not a building), so growth's free-bed check and the bed sign never count it.
[[ability]]
id = "earth_tent"
nation = "earth"
name = "Earth Tent"
verb = "Raise a tent"
description = "Raise a stone shelter. Sleepers nearby stay warm, but nothing cooks there."
chi = 30.0
work = 8.0
speed_modifier = "earthworks"
magnitude_modifier = "earthworks"   # scales duration_minutes
[ability.effect]
kind = "heat_source"
duration_minutes = 12.0
radius = 1
sleep_bonus = 1.4
seek_tiles = 20
cooks = false

# Air, from `meditation` (docs/design/bending.md, "More abilities and the route to mastery"): a
# dome of still air that keeps the cold off a crew caught out on cold ground, but burns nothing,
# so it gives no sleep bonus of its own (`sleep_bonus = 1.0`) and nobody walks to one
# (`seek_tiles = 0`): it's a shield for whoever is already there, not a destination.
[[ability]]
id = "air_shield"
nation = "air"
name = "Air Shield"
verb = "Raise a shield"
description = "Raise a dome of still air. No cold within reach, but it kindles nothing."
chi = 20.0
work = 3.0
magnitude_modifier = "power_generation"   # scales duration_minutes
[ability.effect]
kind = "heat_source"
duration_minutes = 6.0
radius = 3
sleep_bonus = 1.0
seek_tiles = 0
cooks = false

# --- #363 (Fire: Weld, Air: Lift) -----------------------------------------------------------

# Fire, from `forging` (docs/design/bending.md, "More abilities and the route to mastery"): Fire
# has nothing but Hearthflame to bend before Dancing Dragon, so a bender speeds a build site up
# instead -- a kiln, a smelter, anything #357 adds later. Banked work survives until the site's
# own materials arrive.
[[ability]]
id = "weld"
nation = "fire"
name = "Weld"
verb = "Weld"
description = "Lend a building site extra work. Banked work waits for the materials to arrive."
chi = 30.0
work = 6.0
magnitude_modifier = "heating"   # scales work_seconds
[ability.effect]
kind = "build"
work_seconds = 30.0

# Air, from `windmills` (docs/design/bending.md, "More abilities and the route to mastery"): the
# same lever as Weld, caught on the wind instead of the forge -- Air's weak backs build with the
# wind the way Wind Carry hauls with it.
[[ability]]
id = "lift"
nation = "air"
name = "Lift"
verb = "Lift"
description = "Call the wind to speed a building site. Banked work waits for the materials."
chi = 25.0
work = 4.0
magnitude_modifier = "power_generation"   # scales work_seconds
[ability.effect]
kind = "build"
work_seconds = 30.0

# --- #364 (Water: Draw Water, Cut Ice) ----------------------------------------------------------

# Water, from `irrigation` (docs/design/bending.md, "More abilities and the route to mastery"):
# pulls groundwater up into a pool on dry land, away from any river. The pool is a plain Ford
# while it lasts (drinkable, and fresh water for Water the Land's own `source_range`), then
# drains back into the ground on its own, through `reshape`'s `revert_minutes`.
[[ability]]
id = "draw_water"
nation = "water"
name = "Draw Water"
verb = "Draw water"
description = "Pull groundwater into a pool. It drains back into the ground after a while."
chi = 30.0
work = 8.0
speed_modifier = "water_work"
magnitude_modifier = "water_work"   # scales revert_minutes
[ability.effect]
kind = "reshape"
from = ["land"]
to = "ford"
revert_minutes = 10.0

# Water, from `ice_construction` (docs/design/bending.md, "More abilities and the route to
# mastery"): freezes and cuts a river, lake or sea tile beside the bender into ice, Water's own
# building material (the igloo's cost). The ice lands on the bender's own tile; nobody can stand
# on the water to receive it.
[[ability]]
id = "cut_ice"
nation = "water"
name = "Cut Ice"
verb = "Cut ice"
description = "Freeze and cut the water beside you into blocks of ice."
chi = 30.0
work = 10.0
speed_modifier = "water_work"
[ability.effect]
kind = "draw_item"
from = ["river", "lake", "water"]
item = "ice"
count = 4

# --- #695 (Water: Carve Canal) ---------------------------------------------------------------

# Water, from `canals` (docs/design/horizons-phase-2.md, "`canals`: Carve Canal"): cuts a
# permanent channel into land or coast beside fresh water. The tile becomes a `canal`, which every
# water rule counts as a river: not walkable, fresh, a bank for a Fishing Dock or a Tide Mill. The
# bender stands beside the target, and the cut waits until the tile is empty. A cut that would
# split the land in two is refused, at designation and again when it completes. `source` is what
# the target must touch (4-adjacent), or else chain off a pending designation of this same bend:
# the sea doesn't count, since a canal is fresh. Numbers for the fields it waters: `[canal]`.
[[ability]]
id = "carve_canal"
nation = "water"
name = "Carve Canal"
verb = "Carve"
description = "Cut a channel from the river. The water stays, and fields beside it grow faster."
chi = 60.0
work = 20.0
speed_modifier = "water_work"
[ability.effect]
kind = "reshape"
from = ["land", "coast"]
to = "canal"
source = ["river", "lake", "canal"]

# --- #740 (research horizons phase 5: Regrow and Project) --------------------------------------

# Water, from the `plantbending` teaching: the land in a 3x3 patch forgets its weariness. The
# target needs strain on at least one tile in reach ("nothing here is tired").
[[ability]]
id = "regrow"
nation = "water"
name = "Regrow"
verb = "Regrow"
description = "Move the water in the roots, and the land forgets its weariness."
chi = 40.0
work = 10.0
speed_modifier = "water_work"
[ability.effect]
kind = "unstrain"
radius = 1

# Air, from the `spirit_projection` teaching: a long meditation that reveals every buried kind
# within 20 tiles. A test keeps `finds` listing every `buried = true` resource.
[[ability]]
id = "project"
nation = "air"
name = "Project"
verb = "Project"
description = "Meditate, and send the spirit out to see what lies buried."
chi = 60.0
work = 30.0
[ability.effect]
kind = "reveal"
radius = 20
finds = ["gold_seam", "lost_ruins", "great_ruins"]

# Water + Air, from the `cloudbending` fusion (#759, docs/design/horizons-phase-6.md, "Joint
# bends"): a JOINT bend. `nations` stands in for `nation`: it has one slot per nation, claimed
# separately by the nearest able unit of that nation, and its channel runs only while both casters
# are at the target. Each pays the full `chi` (a master pays `master_chi` of it) and gets a bend
# and a form. It has no `speed_modifier`, as two casters would have two. Numbers are provisional
# (#752 sets them). Plots in the 13x13 patch grow at `growth_boost` for `minutes`, under the
# best-boost rule with the Irrigation Channel, a canal and the aqueduct; winter is still the
# climate band's.
[[ability]]
id = "call_rain"
nations = ["water", "air"]
name = "Call Rain"
verb = "Call rain"
description = "A waterbender and an airbender bring a cloud over the fields. Crops under it grow as if irrigated for a season."
chi = 70.0
work = 30.0
rank = "adept"
[ability.effect]
kind = "rain"
radius = 6
growth_boost = 1.5
minutes = 15.0
