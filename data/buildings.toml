# --- Fire Nation ---
# The Fire branch's buildings (issue #26), each unlocked by its tech in data/research.toml.
# `forge`, `brick_kiln` and `smelter` produce now (issue #124: smithing and bricks and metal
# through their `recipe`, below); `steam_engine` and `lightning_station` are power sources
# (`[building.power]`, issue #255, docs/design/late-tree.md, "Power"): every other Fire building
# above sets `uses_power = true` and runs `boost` times as fast within reach. A production
# building's `capacity` of 1 is its one craft job: each works alone, the way a 2-seat study hall
# took two. Costs are a first balance pass over #26's placeholders, heavier than the shared-tier
# buildings above since these are 60- and 120-knowledge techs. Issue #369 closes Fire's chain:
# the kiln's bricks and the smelter's metal now pay for the power buildings below, and the
# forge's tools (now 2 a batch) go to the shared Workshop's advanced buildings, same as
# everyone else's (see "--- Carpentry (shared) ---" at the end of this file).

[[building]]
id = "forge"
name = "Forge"
verb = "Build"
work = 60.0
passable = false
footprint = [2, 2]
capacity = 1
uses_power = true
[[building.cost]]
item = "stone"
count = 8
[[building.cost]]
item = "wood"
count = 4
# The smith job (#124): hot metal worked into tools, two a batch, Fire's faster route to the
# tools the Workshop also makes from wood (#369). Idles once 6 tools are stored (#350).
[building.recipe]
output = "tool"
output_count = 2
work = 25.0
modifier = "heating"
input = [{ item = "metal", count = 1 }]
stock_limit = 6

[[building]]
id = "brick_kiln"
name = "Brick Kiln"
verb = "Build"
work = 70.0
passable = false
footprint = [2, 2]
capacity = 1
uses_power = true
[[building.cost]]
item = "stone"
count = 12
[[building.cost]]
item = "wood"
count = 6
# Fires stone into bricks by the thousand (#124; `brickmaking`'s description, data/research.toml).
# Burns 1 wood a batch as fuel. Brick now stands in for stone everywhere (#371), so the owner
# kept a limit as well as a use: it idles once 60 bricks are stored (#350; raised from 20, not
# removed, since brick is now worth stretching rather than hoarding without end). The power
# buildings below spend bricks too (#369).
[building.recipe]
output = "brick"
output_count = 4
work = 15.0
modifier = "heating"
input = [{ item = "stone", count = 3 }, { item = "wood", count = 1 }]
stock_limit = 60

[[building]]
id = "smelter"
name = "Smelter"
verb = "Build"
work = 90.0
passable = false
footprint = [2, 2]
capacity = 1
uses_power = true
[[building.cost]]
item = "stone"
count = 12
[[building.cost]]
item = "wood"
count = 6
# Draws metal out of ore with steady heat (#124; `smelting`'s description, data/research.toml).
# `gold_ore` is the only ore today (#132, #133): there's no separate generic "ore" item yet.
# Burns 1 wood a batch as fuel and idles once 3 metal are stored (#350). #369 raised this to 6;
# #376 cut it to 3, the Lightning Station's own metal, because a stock of 6 left Fire short of
# the gate's 32 ore on seeds where every other nation had enough (docs/design/nation-buildings.md,
# "Measured").
[building.recipe]
output = "metal"
output_count = 1
work = 20.0
modifier = "heating"
input = [{ item = "gold_ore", count = 2 }, { item = "wood", count = 1 }]
stock_limit = 3

# Spends the kiln's bricks and the smelter's metal (#369): Fire's own production chain pays for
