# Buildings: constructible structures (issue #64). What a building costs, how long it takes to
# put up and what it does once built lives here.
#
# What a building does is whatever optional sections it has: a building with seats > 0 is a
# study hall (issue #21, docs/design/research.md), available from the start with no tech, and
# each of its seats becomes a Study job the moment it's built. A building with a [building.bed]
# is somewhere to sleep, one with a [building.heat] keeps a permanent fire (issue #58).
#
# - verb:     what the designation is called in the UI.
# - cost:     items a construct job hauls to the site before work can start.
# - work:     in-game seconds of work once the cost is fully delivered, at a `construction`
#             modifier of 1.0 (data/nations.toml).
# - passable: whether units may walk onto the tile once the building is finished.
# - footprint: [width, height] in tiles, each 1 to 4; default [1, 1] (issue #207,
#             docs/design/buildings.md). The player places the top-left tile (the anchor) and
#             the building covers the rectangle right and down from it, every tile of which
#             must be free buildable land. A building with a bed must be 1x1. A building keeps
#             the size it was built with, so changing this leaves buildings already standing in
#             a save as they were.
# - beside:   `[terrain, ...]` (issue #373): at least one tile of the footprint's ring (the
#             tiles touching it from outside, corners included) must be one of these terrains,
#             or the placement is refused ("must touch rock" for `["mountain", "tunnel"]`).
#             Optional; absent means no such rule.
# - seats:    how many units may study here at once (0 unless this is a study hall).
# - bed:      units sleep here. A tired unit walks to the nearest bed nobody else is using, if
#             one is within `seek_tiles` path tiles, and sleeps there, regaining energy
#             `sleep_bonus` times as fast. Otherwise it sleeps on the ground where it stands.
#             A bed must be passable: the unit lies on its tile.
# - heat:     a permanent heat source, the same thing Fire's Hearthflame lights for a while
#             (data/bending.toml). Meals eaten within `radius` tiles (a square) count as cooked,
#             so they restore the food's `cooked_hunger` (data/needs.toml), and sleep there
#             regains energy `sleep_bonus` times as fast. A tired unit walks to the warmth when
#             it is within `seek_tiles` path tiles. `radius` is for a `heating` modifier of 1.0
#             (data/nations.toml): it is scaled by the nation's, rounded, and at least 1. It
#             never needs fuel; a fuel economy is future work. Raw food still works with no
#             fire at all.
# - rail:     a track (issue #135, docs/design/research.md, "Rail"). A unit hauling a stack goes
#             `speed` times as fast on a straight step from one rail tile onto the next beside it,
#             and plans its route to use that. Foot traffic gains nothing. Must be passable, and
#             only one building may be a rail. `speed` is above 1.0 and at most 10.
# - orchard:  plants and tends trees around itself (issue #142, docs/design/research.md, "The
#             orchard"). Every `plant_seconds` it plants one `plants` (a renewable resource) on a
#             free land tile within `radius` (a square) that has no other resource or building
#             closer than `spacing` tiles (2 leaves a lane between trees, and keeps them off the
#             orchard's own art), until it tends `max_trees` of them. A new tree is a sapling: it
#             first bears fruit `grow_seconds` after planting. Resting trees of that resource
#             within `radius`, planted or wild, regrow `tend_boost` times as fast. With
#             `auto_pick` each planted tree carries a standing harvest order (#81), so its fruit
#             is picked as it ripens. Which nations can build one is the unlocking tech's
#             business (data/research.toml), not this section's.
# - recipe:   a production building (issue #124): the forge's smith job, a brick kiln, a
#             smelter. `input` (zero or more `{ item, count }`, issue #373) is what one batch
#             consumes; `output`/`output_count` is what it yields. `work` is in-game seconds
#             once a batch's inputs are in, at `modifier` 1.0 (optional, a nation modifier that
#             scales it, like `heating`). A unit holding the building's craft job fetches the
#             inputs, works inside (so a recipe needs a `capacity`, the door it works through),
#             and the cycle repeats for as long as inputs keep coming; it never finishes on its
#             own. `input = []` is a source recipe (issue #373): nothing to fetch, so the crafter
#             goes straight to working, but it still needs a worker and still takes `work`
#             seconds (Earth's Mine Shaft cuts stone from the rock it's built against). A crafter
#             starts a new batch only while fewer than `stock_limit` of `output` (items, optional,
#             default 0 meaning no limit, issue #350) are in stores; a batch already under way
#             finishes regardless.
# - farm:     a farm plot (issue #198, docs/design/research.md, "Farm plots"): empty until a Sow
#             job (`sow_seconds` of work) plants `crop`, which then grows for `grow_seconds`
#             (times `crop_growth`, the hook irrigation and terraces will multiply) before a Reap
#             job (`reap_seconds` of work) gathers `harvest_count` of it and the plot is empty
#             again.
# - names:    what each nation calls this building, if it varies. Either all four nations or
#             none; falls back to `name` for a building that omits it.
# - art:      which sprite a graphical frontend draws it with for each nation, if it varies (the
#             study hall looks different per nation). Either all four nations or none; falls back
#             to the building's `id`, so most buildings need no entry.
# - endeavor: the end game's great work (issue #236, docs/design/endgame.md). It never shows in the
#             build picker and can't be designated: once the endeavor is Ready the Endeavor screen
#             places it, and data/endeavor.toml names it and holds its stages. So it has no cost
#             or work of its own.

[[building]]
id = "bed"
name = "Bed"
verb = "Build"
work = 20.0
passable = true
[building.bed]
sleep_bonus = 1.4
seek_tiles = 30
[[building.cost]]
item = "wood"
count = 5

# A place to keep a flame: it cooks the meals eaten near it and warms sleep. Unlocked by
# `fire_making` (data/research.toml); Fire starts knowing that tech.
[[building]]
id = "campfire"
name = "Campfire"
verb = "Build"
work = 15.0
passable = true
[building.heat]
radius = 2
sleep_bonus = 1.5
seek_tiles = 20
[[building.cost]]
item = "wood"
count = 3

[[building]]
id = "study_hall"
name = "Study Hall"
verb = "Build"
work = 40.0
passable = false
footprint = [2, 2]
seats = 2
[[building.cost]]
item = "wood"
count = 10

[building.names]
air = "Meditation Pavilion"
water = "Elders' Lodge"
earth = "Scroll Library"
fire = "Academy"

[building.art]
air = "meditation_pavilion"
water = "elders_lodge"
earth = "scroll_library"
fire = "academy"

# --- Earth Kingdom ---
# Unlocked by `earthen_walls` (data/research.toml). Nothing in the picker hides a nation's own
# buildings from the others yet, so the other nations see this one locked behind a tech they
# can't research (#137).

# A wall of raised stone: the one thing here that is not walkable, so it can fence off ground,
# divert foot traffic and keep wild resources out. Cost and work are placeholders in the range
# of the starter buildings (a bed is 5 wood, 20 s), pending a balance pass.
[[building]]
id = "earth_wall"
name = "Earth Wall"
verb = "Raise"
work = 20.0
passable = false
[[building.cost]]
item = "stone"
count = 3

# One tile of track, unlocked by `earth_rail` (data/research.toml). Rail is for hauling: a unit
# carrying a stack runs twice as fast between two tiles of it, so a line of rail from the quarry
# to the stockpile halves the trips' walking. Cost and work are placeholders, per tile, pending a
# balance pass: a line of ten is 20 stone and under two minutes of one builder's time.
[[building]]
id = "rail"
name = "Rail"
verb = "Lay"
work = 10.0
passable = true
[building.rail]
speed = 2.0
[[building.cost]]
item = "stone"
count = 2

# --- Air Nomads ---
# The Air branch's buildings (issue #28), each unlocked by its tech in data/research.toml. They
# do what their section says. The orchard plants and tends fruit trees (issue #142); the rest are
# structures only so far, because what they do (grinding grain, turning wind into power, housing
# bison) needs systems that don't exist yet (issues #203, #204, #205). Costs scale with the
# tech's tier and use the items that exist today; they are starting values for a balance pass,
# not a design target.

# The orchard's balance (#142): 8 wood and 45 s of building is about twice a bed's cost, paid back
# by the first fruit it yields. A full orchard (6 trees) bears 2 fruit per tree every 240 s (360 s
# regrow at 1.5x), about 3 fruit a minute against 0.33 from a wild tree, enough raw food for a
# couple of dozen settlers: Air's starting tech, paying for its weak labour. Planting is slow on
# purpose (one sapling every 90 s), so the grove fills in over nine minutes. See
# docs/design/research.md, "The orchard".
[[building]]
id = "orchard"
name = "Orchard"
verb = "Plant"
work = 45.0
passable = true
footprint = [2, 2]
[building.orchard]
plants = "fruit_tree"
radius = 4
max_trees = 6
plant_seconds = 90.0
grow_seconds = 480.0
tend_boost = 1.5
spacing = 2
auto_pick = true
[[building.cost]]
item = "wood"
count = 8

[[building]]
id = "windmill"
name = "Windmill"
verb = "Build"
work = 70.0
passable = false
footprint = [2, 2]
[[building.cost]]
item = "wood"
count = 10
[[building.cost]]
item = "stone"
count = 4

[[building]]
id = "wind_turbine"
name = "Wind Turbine"
verb = "Build"
work = 110.0
passable = false
[[building.cost]]
item = "wood"
count = 12
[[building.cost]]
item = "stone"
count = 8
[[building.cost]]
item = "tool"
count = 2

[[building]]
id = "bison_stable"
name = "Bison Stable"
verb = "Build"
work = 160.0
passable = false
footprint = [2, 2]
[[building.cost]]
item = "wood"
count = 20
[[building.cost]]
item = "stone"
count = 6
[[building.cost]]
item = "tool"
count = 2

# --- Fire Nation ---
# The Fire branch's buildings (issue #26), each unlocked by its tech in data/research.toml.
# `forge`, `brick_kiln` and `smelter` produce now (issue #124: smithing and bricks and metal
# through their `recipe`, below); `steam_engine` and `lightning_station` stay structures only
# until the power system lands (#255). A production building's `capacity` of 1 is its one craft
# job: each works alone, the way a 2-seat study hall took two. Costs are a first balance pass
# over #26's placeholders, heavier than the shared-tier buildings above since these are 60- and
# 120-knowledge techs; the power buildings' costs are still placeholders for #255 to revisit.
# Issue #369 closes Fire's chain: the kiln's bricks and the smelter's metal now pay for the
# power buildings below, and the forge's tools (now 2 a batch) go to the shared Workshop's
# advanced buildings, same as everyone else's (see "--- Carpentry (shared) ---" at the end of
# this file).

[[building]]
id = "forge"
name = "Forge"
verb = "Build"
work = 60.0
passable = false
footprint = [2, 2]
capacity = 1
[[building.cost]]
item = "stone"
count = 8
[[building.cost]]
item = "wood"
count = 4
# The smith job (#124): hot metal worked into tools, two a batch, Fire's faster route to the
# tools the Workshop also makes from wood (#369). Idles once 6 tools are stored (#350).
[building.recipe]
output = "tool"
output_count = 2
work = 25.0
modifier = "heating"
input = [{ item = "metal", count = 1 }]
stock_limit = 6

[[building]]
id = "brick_kiln"
name = "Brick Kiln"
verb = "Build"
work = 70.0
passable = false
footprint = [2, 2]
capacity = 1
[[building.cost]]
item = "stone"
count = 12
[[building.cost]]
item = "wood"
count = 6
# Fires stone into bricks by the thousand (#124; `brickmaking`'s description, data/research.toml).
# Burns 1 wood a batch as fuel. Brick now stands in for stone everywhere (#371), so the owner
# kept a limit as well as a use: it idles once 60 bricks are stored (#350; raised from 20, not
# removed, since brick is now worth stretching rather than hoarding without end). The power
# buildings below spend bricks too (#369).
[building.recipe]
output = "brick"
output_count = 4
work = 15.0
modifier = "heating"
input = [{ item = "stone", count = 3 }, { item = "wood", count = 1 }]
stock_limit = 60

[[building]]
id = "smelter"
name = "Smelter"
verb = "Build"
work = 90.0
passable = false
footprint = [2, 2]
capacity = 1
[[building.cost]]
item = "stone"
count = 12
[[building.cost]]
item = "wood"
count = 6
# Draws metal out of ore with steady heat (#124; `smelting`'s description, data/research.toml).
# `gold_ore` is the only ore today (#132, #133): there's no separate generic "ore" item yet.
# Burns 1 wood a batch as fuel and idles once 6 metal are stored (#350, raised by #369): the
# forge's tools and the power buildings below both draw on metal now.
[building.recipe]
output = "metal"
output_count = 1
work = 20.0
modifier = "heating"
input = [{ item = "gold_ore", count = 2 }, { item = "wood", count = 1 }]
stock_limit = 6

# Spends the kiln's bricks and the smelter's metal (#369): Fire's own production chain pays for
# its power buildings, instead of raw stone.
[[building]]
id = "steam_engine"
name = "Steam Engine"
verb = "Build"
work = 120.0
passable = false
footprint = [2, 2]
[[building.cost]]
item = "brick"
count = 10
[[building.cost]]
item = "metal"
count = 2
[[building.cost]]
item = "wood"
count = 10

[[building]]
id = "lightning_station"
name = "Lightning Station"
verb = "Build"
work = 200.0
passable = false
footprint = [2, 2]
[[building.cost]]
item = "brick"
count = 16
[[building.cost]]
item = "metal"
count = 3
[[building.cost]]
item = "tool"
count = 2
[[building.cost]]
item = "wood"
count = 15

# --- Water Tribe ---

# Unlocked by `ice_construction` (data/research.toml). A snug ice dome: cheaper and slower to put
# up than a bed, and warmer to sleep in. There is no ice item yet, so it costs wood. The numbers
# are provisional (issue #27); the bed's are the baseline.
[[building]]
id = "igloo"
name = "Igloo"
verb = "Build"
work = 30.0
passable = true
[building.bed]
sleep_bonus = 1.6
seek_tiles = 30
[[building.cost]]
item = "wood"
count = 4

# --- The endeavor ---

# The Harmony Gate (docs/design/endgame.md, "The project: four stages"): a 4x4 plaza units walk
# across, built in the stages of data/endeavor.toml. Once complete it is a permanent heat source
# too (docs/design/endgame.md, "The transformation: the United City", #240), so meals eaten on
# or near the plaza count as cooked and sleep there is a little better: a natural gathering point.
[[building]]
id = "harmony_gate"
name = "Harmony Gate"
verb = "Raise"
passable = true
footprint = [4, 4]
endeavor = true
[building.heat]
radius = 3
sleep_bonus = 1.3
seek_tiles = 20

# --- Farming (shared tier) ---
# Appended last, though `farming` (data/research.toml) is a tier-0 tech every nation starts
# able to research: `BuildingId` is this file's position, baked onto every tile a building
# stands on (`Building::id`), so inserting a new entry anywhere earlier would silently change
# what an existing save's buildings are read back as. New shared or nation buildings go here
# from now on, for the same reason.

# Unlocked by `farming` (data/research.toml, shared tier): tilled soil any nation can sow.
# Empty until a Sow job plants it, then cabbage grows for `grow_seconds` (scaled by
# `crop_growth`, the hook irrigation and terraces will multiply, docs/design/research.md, "Farm
# plots") before a Reap job gathers it and it's empty again. One plot nets 3 cabbage every
# 6 + 240 + 6 = 252 s (about six times a wild tree's 1 cabbage per 480 s), for two short stints
# of a farmer's time rather than a wild forage's one. Cost and work are a bed's (5 wood, 20 s)
# halved, since it's only a marked plot of ground, pending a balance pass.
[[building]]
id = "farm_plot"
name = "Farm Plot"
verb = "Till"
work = 10.0
passable = true
[building.farm]
crop = "cabbage"
harvest_count = 3
sow_seconds = 6.0
grow_seconds = 240.0
reap_seconds = 6.0
crop_growth = 1.0
[[building.cost]]
item = "wood"
count = 2

# Unlocked by `irrigation` (data/research.toml, Water tier 1): the permanent version of Water
# the Land's wet state (docs/design/bending.md). Farm plots within `radius` grow `growth_boost`
# times as fast, read by `World::crop_growth_rate` (issue #126) the same way an orchard's
# `tend_boost` speeds up a tree; two channels in reach of one plot don't stack. Radius matches
# the ability's own 3x3 patch (one tile out from center); the boost is an orchard's tend_boost,
# since both are "a building tends things nearby" at the same scale. Cost and work are an
# igloo's (4 wood, 30 s), since it's Water's second building, pending a balance pass once
# terraces (#136) give irrigation a ceiling worth tuning against.
[[building]]
id = "irrigation_channel"
name = "Irrigation Channel"
verb = "Dig"
work = 30.0
passable = true
[building.irrigation]
radius = 3
growth_boost = 1.5
[[building.cost]]
item = "wood"
count = 4

# --- Carpentry (shared tier) ---
# Appended last, though `carpentry` (data/research.toml) is a 60-knowledge shared tech every
# nation can research: see the "Farming" section above for why new shared or nation buildings
# go at the end of this file (`BuildingId` is file position).

# Unlocked by `carpentry` (data/research.toml, shared tier): everyone's fitting-out good, tools
# made from the wood glut rather than scarce stone (docs/design/nation-buildings.md, "Tools").
# Fire's forge is the faster route, from metal; the Workshop is what the other three nations
# have instead. Idles once 6 tools are stored (#350), the same limit the forge carries.
[[building]]
id = "workshop"
name = "Workshop"
verb = "Build"
work = 50.0
passable = false
footprint = [2, 2]
capacity = 1
[[building.cost]]
item = "wood"
count = 8
[[building.cost]]
item = "stone"
count = 4
[building.recipe]
output = "tool"
output_count = 1
work = 40.0
modifier = "construction"
input = [{ item = "wood", count = 3 }]
stock_limit = 6

# --- Earth: mining (issue #373) ---
# Earth runs out of things to raise halfway up its tree (docs/design/nation-buildings.md,
# "Earth: work the land, then dig in"), so it digs in instead. Unlocked by `tunneling`: a miner
# works inside, cutting stone straight out of the rock the shaft is built against, no input to
# fetch (a source recipe, issue #373) but still a worker's time, at about half a quarrier's rate
# after #349. It never runs out, and `stock_limit` (unset: no limit here) would still idle it
# the way #350 idles any other recipe. Its footprint must touch mountain or tunnel (`beside`,
# #373): a shaft against a bored tunnel works the same as one against bare rock.
[[building]]
id = "mine_shaft"
name = "Mine Shaft"
verb = "Dig"
work = 80.0
passable = false
footprint = [2, 2]
capacity = 1
beside = ["mountain", "tunnel"]
[[building.cost]]
item = "stone"
count = 10
[[building.cost]]
item = "wood"
count = 6
[[building.cost]]
item = "tool"
count = 2
[building.recipe]
output = "stone"
output_count = 1
work = 50.0
modifier = "earthworks"
input = []

# Earth's capstone, unlocked by `metalbending`: metal braces a shaft deep enough to reach gold,
# Metalbend's economic use (docs/design/nation-buildings.md). Same footprint and placement rule
# as the Mine Shaft, and the same kind of source recipe (no input). Its ore isn't a harvest, so
# it doesn't add to the "Ore mined" tally (data/endeavor.toml), the same way Metalbend's own
# metal doesn't.
[[building]]
id = "deep_mine"
name = "Deep Mine"
verb = "Dig"
work = 150.0
passable = false
footprint = [2, 2]
capacity = 1
beside = ["mountain", "tunnel"]
[[building.cost]]
item = "stone"
count = 20
[[building.cost]]
item = "metal"
count = 4
[[building.cost]]
item = "tool"
count = 2
[building.recipe]
output = "gold_ore"
output_count = 1
work = 150.0
modifier = "earthworks"
input = []
