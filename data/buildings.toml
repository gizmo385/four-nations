# --- Air Nomads ---
# The Air branch's buildings (issue #28), each unlocked by its tech in data/research.toml. They
# do what their section says. The orchard plants and tends fruit trees (issue #142); the wind
# turbine is Air's power source (#204, below). The windmill and the bison stable are still
# structures only, waiting on systems that don't exist yet (issues #488, #205). Costs scale with
# the tech's tier and use the items that exist today; they are starting values for a balance
# pass, not a design target.

# The orchard's balance (#142): 8 wood and 45 s of building is about twice a bed's cost, paid back
# by the first fruit it yields. A full orchard (4 trees, docs/design/materials.md section 4,
# #353) bears 2 fruit per tree every 288 s (360 s regrow at 1.25x), about 25 fruit a season
# instead of 45: still Air's easy food (pillar 1), just not a bottomless one. Planting is slow on
# purpose (one sapling every 90 s), so the grove fills in over six minutes. See
# docs/design/research.md, "The orchard".
[[building]]
id = "orchard"
name = "Orchard"
verb = "Plant"
work = 45.0
passable = true
footprint = [2, 2]
[building.orchard]
plants = "fruit_tree"
radius = 4
max_trees = 4
plant_seconds = 90.0
grow_seconds = 480.0
tend_boost = 1.25
spacing = 2
auto_pick = true
[[building.cost]]
item = "wood"
count = 8

