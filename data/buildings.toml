modifier = "construction"
input = [{ item = "wood", count = 3 }]
stock_limit = 6

# --- Earth: mining (issue #373) ---
# Earth runs out of things to raise halfway up its tree (docs/design/nation-buildings.md,
# "Earth: work the land, then dig in"), so it digs in instead. Unlocked by `tunneling`: a miner
# works inside, cutting stone straight out of the rock the shaft is built against, no input to
# fetch (a source recipe, issue #373) but still a worker's time, at about half a quarrier's rate
# after #349. It never runs out, and `stock_limit` (unset: no limit here) would still idle it
# the way #350 idles any other recipe. Its footprint must touch mountain or tunnel (`beside`,
# #373): a shaft against a bored tunnel works the same as one against bare rock.
[[building]]
id = "mine_shaft"
name = "Mine Shaft"
verb = "Dig"
work = 80.0
passable = false
footprint = [2, 2]
capacity = 1
uses_power = true
beside = ["mountain", "tunnel"]
[[building.cost]]
item = "stone"
count = 10
[[building.cost]]
item = "wood"
count = 6
[[building.cost]]
item = "tool"
count = 2
[building.recipe]
output = "stone"
output_count = 1
work = 50.0
modifier = "earthworks"
input = []

# Earth's capstone, unlocked by `metalbending`: metal braces a shaft deep enough to reach gold,
# Metalbend's economic use (docs/design/nation-buildings.md). Same footprint and placement rule
# as the Mine Shaft, and the same kind of source recipe (no input). Its ore isn't a harvest, so
# it doesn't add to the "Ore mined" tally (data/endeavor.toml), the same way Metalbend's own
# metal doesn't.
[[building]]
id = "deep_mine"
name = "Deep Mine"
verb = "Dig"
work = 150.0
passable = false
footprint = [2, 2]
capacity = 1
uses_power = true
beside = ["mountain", "tunnel"]
[[building.cost]]
item = "stone"
count = 20
[[building.cost]]
item = "metal"
count = 4
[[building.cost]]
item = "tool"
count = 2
[building.recipe]
output = "gold_ore"
output_count = 1
work = 150.0
modifier = "earthworks"
input = []

# --- Water: healing (issue #375) ---
# Unlocked by `healing`: Water's pillar, narrowing #125. A hurt settler whose other needs are
# comfortable walks in and rests, healing 8 health a minute (16 for Water, at `water_work`'s
# 2.0) until it reaches 90, instead of the passive 2 everyone gets while comfortable
# (data/needs.toml). 8 is above that passive rate (the point of the building); 90 leaves some
# headroom for the passive rate to finish the job after a unit steps back out. Cost and work
# sit with Water's other buildings (the igloo, 4 wood; the channel, 4 wood, 30 s): a little more
# than either since it costs tools too, the first Water building to need them (`workshop`,
# #369).
[[building]]
id = "healing_hut"
name = "Healing Hut"
verb = "Build"
work = 60.0
passable = false
footprint = [2, 2]
capacity = 2
[[building.cost]]
item = "wood"
count = 10
[[building.cost]]
item = "stone"
count = 4
[[building.cost]]
item = "tool"
count = 1
[building.healing]
seek_below = 60.0
regen_per_minute = 8.0
stop_at = 90.0
modifier = "water_work"

# Water's orchard, on the water (issue #374, docs/design/nation-buildings.md, "Water: heal, fish
# through winter, restore chi"). Unlocked by `water_travel`: it plants up to 3 fish spots in the
# water within reach and tends them 1.25x faster; `auto_pick` means each is fished as it ripens,
# with nobody designating it, the same as the orchard's fruit. Its footprint must touch water
# (`beside`, #373): the dock sits on the bank, built from solid land, not afloat. Fishing is
# frost-hardy (data/jobs.toml), so this is the one producer that keeps working through winter,
# which suits a polar nation.
[[building]]
id = "fishing_dock"
name = "Fishing Dock"
verb = "Build"
work = 70.0
passable = false
footprint = [2, 2]
beside = ["water", "river", "lake"]
[[building.cost]]
item = "wood"
count = 12
[[building.cost]]
item = "tool"
count = 2
[building.orchard]
plants = "fish_spot"
radius = 4
max_trees = 3
plant_seconds = 120.0
grow_seconds = 300.0
tend_boost = 1.25
spacing = 2
auto_pick = true

# --- Herbalism (shared tier) ---
# Appended last, for the same reason the Farming section above is: `BuildingId` is this file's
# position.

# Unlocked by `herbalism` (data/research.toml, shared tier): tilled soil sown with herbs instead
# of cabbage, the same way as the farm plot above -- sow, grow, reap -- just a different crop
# (issue #390, docs/design/harm.md "Healing: a job for each feature"). A hurt or sick settler
# fetches a grown herb from stores on its own, like a meal (`[[remedy]]`, data/harm.toml). Cost
# and work match the farm plot exactly; only the crop and its timing differ.
[[building]]
id = "herb_garden"
name = "Herb Garden"
verb = "Till"
work = 10.0
passable = true
[building.farm]
crop = "herbs"
harvest_count = 2
sow_seconds = 6.0
grow_seconds = 300.0
reap_seconds = 6.0
crop_growth = 1.0
[[building.cost]]
item = "wood"
count = 2

# --- Water: power (issue #200) ---
# Unlocked by `tide_mills`: Water's first power source (docs/design/power.md, "The track, per
# nation"), built on the bank the same way the Fishing Dock is (`beside`, #373). A reach of 4
# tiles at Water's 1.0 `power_generation`, 5 once `tide_mills` raises it to 1.25 -- the same 5
# every nation's first source reaches. Cost and work sit between the Fishing Dock (12 wood, 2
# tools, 70 s) and the Healing Hut (10 wood, 4 stone, 1 tool, 60 s); #432 balances it further.
[[building]]
id = "tide_mill"
name = "Tide Mill"
verb = "Build"
work = 100.0
passable = false
footprint = [2, 2]
beside = ["water", "river", "lake"]
[building.power]
radius = 4
boost = 1.5
[[building.cost]]
item = "wood"
count = 14
[[building.cost]]
item = "stone"
count = 6
[[building.cost]]
item = "tool"
count = 2

# Paving's road (docs/design/horizons-phase-1.md): one stone a tile, laid in lines like rail.
# Every step along it is 1.25x faster (8 on the 10-unit step grid; 1.3 can't be represented).
# Tearing it up gives nothing back: the refund rounds 1 stone down to 0.
[[building]]
id = "paved_road"
name = "Paved Road"
verb = "Pave"
work = 6.0
passable = true
[building.track]
speed = 1.25
[[building.cost]]
item = "stone"         # brick stands in, as for any stone cost
count = 1

# Lemur Keeping's roost (Air, docs/design/horizons-phase-1.md): picks the nearest ripe fruit tree
# within 5 tiles every 30 s, at most 4 fruit a minute, and keeps 3 of every 4. The fruit goes
# straight into a stockpile in reach, else drops beside the roost.
[[building]]
id = "lemur_roost"
name = "Lemur Roost"
verb = "Build"
work = 40.0
passable = false
[building.pickers]
resources = ["fruit_tree"]
radius = 5             # Chebyshev from the roost: an 11x11 square. Not modifier-scaled
pick_seconds = 30.0    # at most one tree per 30 s
eat_every = 4          # the lemurs eat every 4th fruit they pick
[[building.cost]]
item = "wood"
count = 6
[[building.cost]]
item = "fruit"
count = 4

# Oil Lamps' lamp (Water, docs/design/horizons-phase-1.md): wide heat that burns fish, not wood.
# It burns only while someone is in reach, at most 15 fish an hour, and an empty lamp neither
# warms nor cooks.
[[building]]
id = "oil_lamp"
name = "Oil Lamp"
verb = "Light"
work = 15.0
passable = true
[building.heat]
radius = 4             # x Water's heating 0.8 = 3: a 7x7 square, against a campfire's 5x5
sleep_bonus = 1.5
seek_tiles = 20
[building.fuel]
item = "fish"
bunker = 6
per_minute = 0.25      # only while someone is in reach
[[building.cost]]
item = "stone"         # brick stands in, as for any stone cost
count = 2
[[building.cost]]
item = "fish"
count = 2

# Hothouses' Hothouse (Fire, docs/design/horizons-phase-1.md): plots within 2 tiles grow through
# winter, for 2 wood a minute while it warms them (about 30 a winter).
[[building]]
id = "hothouse"
name = "Hothouse"
verb = "Build"
work = 90.0
passable = false
footprint = [2, 2]
[building.hothouse]
