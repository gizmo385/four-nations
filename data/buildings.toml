# Water's orchard, on the water (issue #374, docs/design/nation-buildings.md, "Water: heal, fish
# through winter, restore chi"). Unlocked by `water_travel`: it plants up to 3 fish spots in the
# water within reach and tends them 1.25x faster; `auto_pick` means each is fished as it ripens,
# with nobody designating it, the same as the orchard's fruit. Its footprint must touch water
# (`beside`, #373): the dock sits on the bank, built from solid land, not afloat. Fishing is
# frost-hardy (data/jobs.toml), so this is the one producer that keeps working through winter,
# which suits a polar nation.
[[building]]
id = "fishing_dock"
name = "Fishing Dock"
verb = "Build"
work = 70.0
passable = false
footprint = [2, 2]
beside = ["water", "river", "lake"]
[[building.cost]]
item = "wood"
count = 12
[[building.cost]]
item = "tool"
count = 2
[building.orchard]
plants = "fish_spot"
radius = 4
max_trees = 3
plant_seconds = 120.0
grow_seconds = 300.0
tend_boost = 1.25
spacing = 2
auto_pick = true

# --- Herbalism (shared tier) ---
# Appended last, for the same reason the Farming section above is: `BuildingId` is this file's
# position.

# Unlocked by `herbalism` (data/research.toml, shared tier): tilled soil sown with herbs instead
# of cabbage, the same way as the farm plot above -- sow, grow, reap -- just a different crop
# (issue #390, docs/design/harm.md "Healing: a job for each feature"). A hurt or sick settler
# fetches a grown herb from stores on its own, like a meal (`[[remedy]]`, data/harm.toml). Cost
# and work match the farm plot exactly; only the crop and its timing differ.
[[building]]
id = "herb_garden"
name = "Herb Garden"
verb = "Till"
work = 10.0
passable = true
[building.farm]
crop = "herbs"
harvest_count = 2
sow_seconds = 6.0
grow_seconds = 300.0
reap_seconds = 6.0
crop_growth = 1.0
[[building.cost]]
item = "wood"
count = 2

# --- Water: power (issue #200) ---
# Unlocked by `tide_mills`: Water's first power source (docs/design/power.md, "The track, per
# nation"), built on the bank the same way the Fishing Dock is (`beside`, #373). A reach of 4
# tiles at Water's 1.0 `power_generation`, 5 once `tide_mills` raises it to 1.25 -- the same 5
# every nation's first source reaches. Cost and work sit between the Fishing Dock (12 wood, 2
# tools, 70 s) and the Healing Hut (10 wood, 4 stone, 1 tool, 60 s); #432 balances it further.
[[building]]
id = "tide_mill"
name = "Tide Mill"
verb = "Build"
work = 100.0
passable = false
footprint = [2, 2]
beside = ["water", "river", "lake"]
[building.power]
radius = 4
boost = 1.5
[[building.cost]]
item = "wood"
count = 14
[[building.cost]]
item = "stone"
count = 6
[[building.cost]]
item = "tool"
count = 2
