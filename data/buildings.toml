passable = false
footprint = [2, 2]
beside = ["mountain", "tunnel"]
[building.power]
radius = 2
boost = 1.2
[[building.cost]]
item = "stone"         # brick stands in, as for any stone cost
count = 12
[[building.cost]]
item = "wood"
