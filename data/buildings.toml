# Buildings: constructible structures (issue #64). What a building costs and how long it takes
# to put up lives here; what a built building *does* (sleeping, cooking...) is follow-up work
# (#58 beds/hearth) and isn't assumed by anything that reads this file, except seats: a building
# with seats > 0 is a study hall (issue #21, docs/design/research.md), available from the start
# with no tech. Each of its seats becomes a Study job the moment it's built.
#
# - verb:     what the designation is called in the UI.
# - cost:     items a construct job hauls to the site before work can start.
# - work:     in-game seconds of work once the cost is fully delivered, at a `construction`
#             modifier of 1.0 (data/nations.toml).
# - passable: whether units may walk onto the tile once the building is finished.
# - seats:    how many units may study here at once (0 unless this is a study hall).
# - names:    what each nation calls this building, if it varies. Either all four nations or
#             none; falls back to `name` for a building that omits it.

[[building]]
id = "bed"
name = "Bed"
verb = "Build"
work = 20.0
passable = false
[[building.cost]]
item = "wood"
count = 5

# A place to keep a flame (issue #22's research gate; what it actually lights is #58). Unlocked
# by `fire_making` (data/research.toml); Fire starts knowing that tech.
[[building]]
id = "campfire"
name = "Campfire"
verb = "Build"
work = 15.0
passable = true
[[building.cost]]
item = "wood"
count = 3

[[building]]
id = "study_hall"
name = "Study Hall"
verb = "Build"
work = 40.0
passable = true
seats = 2
[[building.cost]]
item = "wood"
count = 10

[building.names]
air = "Meditation Pavilion"
water = "Elders' Lodge"
earth = "Scroll Library"
fire = "Academy"
