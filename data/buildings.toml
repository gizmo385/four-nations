winter_growth = 0.75   # replaces the climate band's winter growth in reach
[building.fuel]
item = "wood"
bunker = 20
per_minute = 2.0       # only in winter, while a plot in reach is growing or ripe
[[building.cost]]
item = "brick"
count = 10
[[building.cost]]
item = "wood"
count = 6
[[building.cost]]
item = "tool"
count = 1

# Omashu Chutes' Chute (Earth, docs/design/horizons-phase-1.md): a slide cut into the rock that
# drops goods to a foot up to 16 tiles away and at least 8 lower.
[[building]]
id = "chute"
name = "Chute"
verb = "Cut"
work = 60.0
passable = false
beside = ["mountain", "tunnel"]   # the head touches rock: the Mine Shaft's own rule
[building.chute]
reach = 16             # the foot is within 16 tiles, Chebyshev
drop = 8               # and at least 8 elevation below the head
[[building.cost]]
item = "stone"         # brick stands in, as for any stone cost
count = 12
[[building.cost]]
item = "wood"
count = 4
[[building.cost]]
item = "tool"
count = 1

# --- Earth: power (issue #448) ---
# Unlocked by `seismic_sense`: Earth's weak source (docs/design/power.md, "Earth's source
# (#446)"), a geothermal mill that taps the heat in the rock, so it must touch mountain or tunnel
# (`beside`, #373) like the Mine Shaft it sits beside. A reach of 2 tiles at Earth's 0.8
# `power_generation` (round(2 x 0.8) = 2) and a 1.2x boost: weaker and shorter than any other
