# Buildings: constructible structures (issue #64). What a building costs, how long it takes to
# put up and what it does once built lives here.
#
# What a building does is whatever optional sections it has: a building with seats > 0 is a
# study hall (issue #21, docs/design/research.md), available from the start with no tech, and
# each of its seats becomes a Study job the moment it's built. A building with a [building.bed]
# is somewhere to sleep, one with a [building.heat] keeps a permanent fire (issue #58).
#
# - verb:     what the designation is called in the UI.
# - cost:     items a construct job hauls to the site before work can start.
# - work:     in-game seconds of work once the cost is fully delivered, at a `construction`
#             modifier of 1.0 (data/nations.toml).
# - passable: whether units may walk onto the tile once the building is finished.
# - footprint: [width, height] in tiles, each 1 to 4; default [1, 1] (issue #207,
#             docs/design/buildings.md). The player places the top-left tile (the anchor) and
#             the building covers the rectangle right and down from it, every tile of which
#             must be free buildable land. A building with a bed must be 1x1. A building keeps
#             the size it was built with, so changing this leaves buildings already standing in
#             a save as they were.
# - beside:   `[terrain, ...]` (issue #373): at least one tile of the footprint's ring (the
#             tiles touching it from outside, corners included) must be one of these terrains,
#             or the placement is refused ("must touch rock" for `["mountain", "tunnel"]`).
#             Optional; absent means no such rule.
# - seats:    how many units may study here at once (0 unless this is a study hall).
# - bed:      units sleep here. A tired unit walks to the nearest bed nobody else is using, if
#             one is within `seek_tiles` path tiles, and sleeps there, regaining energy
#             `sleep_bonus` times as fast. Otherwise it sleeps on the ground where it stands.
#             A bed must be passable: the unit lies on its tile.
# - heat:     a permanent heat source, the same thing Fire's Hearthflame lights for a while
#             (data/bending.toml). Meals eaten within `radius` tiles (a square) count as cooked,
#             so they restore the food's `cooked_hunger` (data/needs.toml), and sleep there
#             regains energy `sleep_bonus` times as fast. A tired unit walks to the warmth when
#             it is within `seek_tiles` path tiles. `radius` is for a `heating` modifier of 1.0
#             (data/nations.toml): it is scaled by the nation's, rounded, and at least 1. Raw
#             food still works with no fire at all. With `fuel` (below), the fire is out while
#             its bunker is empty.
# - track:    a track (rail, issue #135; the Paved Road, docs/design/horizons-phase-1.md). A
#             straight step from one tile of it onto the next tile of the same track beside it
#             costs the step divided by `speed` (rounded on the 10-unit step grid), for every
#             unit, and routes plan to use that. Any other step (a diagonal, road onto rail) is
#             ordinary. Must be passable; more than one building may be a track. `speed` is
#             above 1.0 and at most 10.
# - fuel:     a fuel bunker (docs/design/horizons-phase-1.md, "Fuel bunkers"): `item` is burned,
#             `bunker` (at least 1) is how many it holds, and `per_minute` (above 0) how fast it
#             burns, only while the building's effect is in use (a heat source: while anyone is
#             in its reach). The effect is off while the bunker is empty. It finishes empty; at
#             or below half full a Refuel haul brings the shortfall from stores. Fuel in a
#             bunker is out of stores, so nobody eats it, and taking the building down returns
#             it in full.
# - pickers:  harvests ripe trees in reach with no worker (docs/design/horizons-phase-1.md, the
#             Lemur Roost). Every `pick_seconds` it picks the nearest ripe `resources` tree within
#             `radius` of its footprint (ties by tile index), skipping one a settler has claimed.
#             A pick is a normal harvest (strain, the harvest tally). Every `eat_every`-th item
#             (at least 2) is eaten; the rest goes into the nearest stockpile in reach with room,
#             else drops beside it.
# - hothouse: winter growth for farm plots in reach (docs/design/horizons-phase-1.md, the
#             Hothouse). In winter, while fuelled, every `[building.farm]` plot within `radius`
#             of its footprint (not `heating`-scaled) grows at `winter_growth` (0 to 1) where
#             that beats its band's, not scaled by `winter_severity`; two don't stack. The first
#             frost spares ripe plots in reach. Its fuel burns only in winter while a plot in
#             reach is growing or ripe. With seasons off it does nothing.
# - chute:    a one-way drop for goods (docs/design/horizons-phase-1.md, the Chute). Its foot is
#             set with `Command::SetLink`: open ground within `reach` (Chebyshev) and at least
#             `drop` lower in elevation. A unit taking a stack to stores walks to the head instead
#             when the head plus the foot's walk to stores is cheaper; the stack lands at the foot
#             as a ground stack for an ordinary haul. With no valid foot it does nothing.
# - pair:     a two-way link between two buildings of this id (docs/design/horizons-phase-2.md,
#             "Paired links"; the Wind Gate and the Balloon Dock). `Command::SetLink` names the
#             partner: a building or build site of the same id whose anchor is within `reach`
#             (Chebyshev) and at least `min_tiles` away (`min_tiles` at most `reach`). Both ends
#             link to each other and any earlier partner is let go; taking either end down clears
#             the other's link. The doors of both ends must be in one walkable region, or the link
#             is refused ("not reachable on foot"); a pair that a map change later splits is "Cut
#             off" and does nothing. Not with `chute`, which uses the same link one-way.
# - orchard:  plants and tends a renewable resource around itself (issue #142, docs/design/
#             research.md, "The orchard"). Every `plant_seconds` it plants one `plants` (a
#             renewable resource) on a free tile of its own mapgen terrain within `radius` (a
#             square) that has no other resource or building closer than `spacing` tiles (2
#             leaves a lane between trees, and keeps them off the orchard's own art), until it
#             tends `max_trees` of them. `plants`'s own mapgen `beside` rule, if it has one,
#             still applies, and a resource that spawns on water (Water's Fishing Dock, #374)
#             skips the walkable check: the water itself is the point. A new tree is a sapling: it
#             first bears fruit `grow_seconds` after planting. Resting trees of that resource
#             within `radius`, planted or wild, regrow `tend_boost` times as fast. With
#             `auto_pick` each planted tree carries a standing harvest order (#81), so its fruit
#             is picked as it ripens. Which nations can build one is the unlocking tech's
#             business (data/research.toml), not this section's.
# - recipe:   a production building (issue #124): the forge's smith job, a brick kiln, a
#             smelter. `input` (zero or more `{ item, count }`, issue #373) is what one batch
#             consumes; `output`/`output_count` is what it yields. `work` is in-game seconds
#             once a batch's inputs are in, at `modifier` 1.0 (optional, a nation modifier that
#             scales it, like `heating`). A unit holding the building's craft job fetches the
#             inputs, works inside (so a recipe needs a `capacity`, the door it works through),
#             and the cycle repeats for as long as inputs keep coming; it never finishes on its
#             own. `input = []` is a source recipe (issue #373): nothing to fetch, so the crafter
#             goes straight to working, but it still needs a worker and still takes `work`
#             seconds (Earth's Mine Shaft cuts stone from the rock it's built against). A crafter
#             starts a new batch only while fewer than `stock_limit` of `output` (items, optional,
#             default 0 meaning no limit, issue #350) are in stores; a batch already under way
#             finishes regardless.
# - farm:     a farm plot (issue #198, docs/design/research.md, "Farm plots"): empty until a Sow
#             job (`sow_seconds` of work) plants `crop`, which then grows for `grow_seconds`
#             (times `crop_growth`, the hook irrigation and terraces will multiply) before a Reap
#             job (`reap_seconds` of work) gathers `harvest_count` of it and the plot is empty
#             again.
# - healing:  a place hurt settlers rest (issue #375, Water's Healing Hut). A unit whose health
#             is below `seek_below` and whose needs are all comfortable (none at or below `low`,
#             data/needs.toml) walks to the nearest one with a free place and heals
#             `regen_per_minute` times `modifier` (optional, a nation modifier) until health
#             reaches `stop_at` or a need pre-empts it. `regen_per_minute` must beat
#             data/needs.toml's passive `health.regen_per_minute`, or it would do nothing; needs
#             a `capacity`, the door it heals through, the same way a study hall's seats work.
# - power:    a power source (issue #428, docs/design/late-tree.md): work in a `uses_power`
#             building within reach runs `boost` times as fast (above 1.0, at most 4.0). `radius`
#             is for a `power_generation` modifier of 1.0 (data/nations.toml), scaled the same
#             way `heat`'s is by `heating` -- rounded, at least 1 tile -- and measured the same
#             way, Chebyshev from every tile of the source's footprint. Two sources in reach of
#             one consumer don't stack; the best `boost` applies. Which buildings are sources:
#             #255 (Fire), #200 (Water, `tide_mill`), #204 (Air, `wind_turbine`) and #448
#             (Earth, `hot_spring_mill`).
# - uses_power: this building's recipe batches or study seats run at the best `boost` of any
#             power source in reach of any tile of its own footprint, else at their plain rate.
#             Set on `workshop`, `forge`, `brick_kiln`, `smelter`, `mine_shaft`, `deep_mine` and
#             `study_hall`.
# - names:    what each nation calls this building, if it varies. Either all four nations or
#             none; falls back to `name` for a building that omits it.
# - art:      which sprite a graphical frontend draws it with for each nation, if it varies (the
#             study hall looks different per nation). Either all four nations or none; falls back
#             to the building's `id`, so most buildings need no entry.
# - endeavor: the end game's great work (issue #236, docs/design/endgame.md). It never shows in the
#             build picker and can't be designated: once the endeavor is Ready the Endeavor screen
#             places it, and data/endeavor.toml names it and holds its stages. So it has no cost
#             or work of its own.

# Taking a finished building down (issue #342, the Clear tool's buildings mode). `refund` is the
# share of each cost item dropped by the anchor when it comes down, rounded down per item (half:
# a cost of 5 wood gives back 2). `work` is the job's seconds as a share of the building's own
# `work`, at the same `construction` modifier. A production building's batch inputs already
# delivered come back in full, as a cancelled site's deliveries do.
[deconstruct]
refund = 0.5
work = 0.5

[[building]]
