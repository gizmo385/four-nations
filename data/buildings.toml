id = "healing_hut"
name = "Healing Hut"
verb = "Build"
work = 60.0
passable = false
footprint = [2, 2]
capacity = 2
[[building.cost]]
item = "wood"
count = 10
[[building.cost]]
item = "stone"
count = 4
[[building.cost]]
