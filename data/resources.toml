# Map resources. Each rolls from its own RNG stream keyed by its id (#225), so adding, removing or
# reordering entries never moves the others. File order is only priority: where two resources
# both pass on a tile, the earlier one wins it.
# Omitting `terrains` or `biomes` means "any".
#
# - chance:          base probability per eligible tile, in [0, 1].
# - clustering:      0..1 (default 0). How much the chance follows a per-resource noise field;
#                    1 = dense groves/outcrops with clearings between, 0 = salt-and-pepper.
# - moisture_scaled: true makes the chance follow tile moisture (x0.5 dry .. x1.5 wet).
# - min_spacing:     no two of this resource within this many tiles (Chebyshev), for spread-out
#                    deposits.
# - beside:          the tile must touch (8 neighbours) one of these terrains. Fish spots use it
#                    to stay within reach of the shore, since units fish from the bank.
# - buried:          true keeps it underground (#133): the world takes it off the map when it is
#                    made, and only a `reveal` ability whose `finds` names it (data/bending.toml;
#                    a Bore Tunnel striking a gold seam counts too) brings it back, to be worked
#                    like any other. Until then nothing shows it.

# Ancient scrolls (#24): a rare find in the barren wastes, the one way exploring pays in
# knowledge. Hauled to a study hall, each is read for the `knowledge` its item carries
# (data/jobs.toml). Listed first so a scroll isn't hidden by the firs that grow in the tundra, and
# spaced far apart: about 3-6 on a 192x128 map.
[[resource]]
id = "ancient_scroll"
name = "Ancient Scroll"
glyph = "?"
chance = 0.004
terrains = ["land"]
biomes = ["tundra", "desert"]
min_spacing = 20

# Gold is a find, not wallpaper, but mountains only: a non-Earth settlement that strips every
# reachable vein within 40 tiles still needs several times today's density to pass the ore sign.
# chance and min_spacing raised by #349 (docs/design/materials.md, section 1; the balance survey
# below is #348's `balance --supply`, not the doc's own throwaway trial, whose reachability
# estimate ran well above what the real tool measures): seeds 1-8, Small, median gold_vein worth
# reachable within 40 tiles went from 4 to 42 ore against the sign's 40 (jobs.toml's richer
# `count` does the rest). Listed first so it wins over stone on a mountain tile.
[[resource]]
id = "gold_vein"
name = "Gold Vein"
glyph = "$"
chance = 0.14
terrains = ["mountain"]
min_spacing = 2

[[resource]]
id = "stone"
name = "Stone Outcrop"
glyph = "o"
chance = 0.25
terrains = ["mountain"]
clustering = 0.6

[[resource]]
id = "oak_tree"
name = "Oak Tree"
glyph = "T"
chance = 0.25
terrains = ["land"]
biomes = ["plains", "swamp"]
clustering = 0.9
moisture_scaled = true

[[resource]]
id = "fir_tree"
name = "Fir Tree"
glyph = "F"
chance = 0.45
terrains = ["land"]
biomes = ["forest", "taiga", "tundra"]
clustering = 0.7
moisture_scaled = true

# Foothill boulders (#349, docs/design/materials.md, section 2): open land beside a mountain, so
# every nation can quarry stone without boring into rock, not just the outcrops on the mountain
# tiles themselves. Listed after the trees so it never displaces them (a boulder only takes land
# the forests passed on). Blocks movement like any other resource tile, which is also why `chance`
# stays at the doc's "about 0.2" rather than rising further: a denser field of boulders chokes the
# walkable ground around a mountain's foot, which measurably costs more reachable outcrops and
# veins than the extra boulders are worth (jobs.toml's `count` carries the rest of the load).
[[resource]]
id = "boulder"
name = "Boulder"
glyph = "0"
chance = 0.2
terrains = ["land"]
beside = ["mountain"]
clustering = 0.5

[[resource]]
id = "cabbage"
name = "Wild Cabbage"
glyph = "c"
chance = 0.02
terrains = ["land"]
biomes = ["plains", "forest"]

# Renewable food (#56). These stay on the map when harvested and ripen again; see `regrow` in
# data/jobs.toml. Listed last so they never displace the resources above.
[[resource]]
id = "fruit_tree"
name = "Fruit Tree"
glyph = "Y"
chance = 0.02
terrains = ["land"]
biomes = ["plains", "forest"]
clustering = 0.9
moisture_scaled = true

# Fishing grounds: water tiles within reach of the bank (sea, lakes and rivers).
[[resource]]
id = "fish_spot"
name = "Fishing Spot"
glyph = "f"
chance = 0.06
terrains = ["water", "lake", "river", "canal"]
beside = ["coast", "land"]
clustering = 0.6

# Gold seams (#133, docs/design/research.md, "Seismic sense"): rich gold buried in the rock, found
# only by Earth's Seismic Sense. Listed last so it only takes mountain tiles nothing else holds,
# and spaced out: roughly 20-30 on a 192x128 map.
[[resource]]
id = "gold_seam"
name = "Gold Seam"
glyph = "!"
chance = 0.04
terrains = ["mountain"]
min_spacing = 5
buried = true

# --- #197 (Air: gliders) -----------------------------------------------------------------------

# Lost ruins (#197, docs/design/research.md, "Gliders"): old settlements the grass has grown
# over, spotted only from the air by Air's Glide. Listed last so a ruin only takes open ground
# nothing else holds, and spaced far apart: roughly 8-12 on a 192x128 map. Searched for scrolls
# (data/jobs.toml).
[[resource]]
id = "lost_ruins"
name = "Lost Ruins"
glyph = "n"
chance = 0.005
terrains = ["land"]
min_spacing = 20
buried = true
