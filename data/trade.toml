# --- Air: knowledge ---
[[caravan]]
nation = "air"
name = "Air Nomad travellers"

[[caravan.deal]]
give = [{ item = "food", count = 25 }]
knowledge = 40
times = 2

[[caravan.deal]]
give = [{ item = "wood", count = 30 }]
knowledge = 30
times = 2

[[caravan.deal]]
give = [{ item = "stone", count = 15 }]
get = [{ item = "fruit", count = 5 }]
times = 2

# Air's fourth deal (#711): bricks for knowledge, so the list always has four. Never copies for
# knowledge: the loader refuses that (copies would turn back into research points).
[[caravan.deal]]
give = [{ item = "brick", count = 8 }]
knowledge = 30
times = 2

[[caravan.request]]
name = "Food for the monks of the Eastern Air Temple"
give = [{ item = "food", count = 40 }]
reward = { knowledge = 60 }

# Air's monks buy newcomers with what the settlement makes (and, once a caravan's chart has a
# system, charts with copies), never knowledge for copies.
[[caravan.request]]
name = "Gifts for the festival at the Western Air Temple"
give = [{ item = "wares", count = 12 }]
reward = { draw = 0.5 }

# Wants { chart = 1 } (docs/design/horizons-phase-3.md). The loader refuses a chart reward until
# a caravan's chart has a system, so this pays a smaller draw for now.
[[caravan.request]]
name = "Copies for the Eastern Air Temple"
give = [{ item = "scroll_copy", count = 2 }]
reward = { draw = 0.25 }
