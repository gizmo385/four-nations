get = [{ item = "fish", count = 5 }]
times = 2

[[caravan.deal]]
give = [{ item = "wood", count = 20 }]
get = [{ item = "herbs", count = 4 }]
times = 2

[[caravan.deal]]
give = [{ item = "wood", count = 30 }]
get = [{ item = "ice", count = 6 }]
times = 2

[[caravan.deal]]
