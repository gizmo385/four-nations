times = 3

[[caravan.deal]]
give = [{ item = "wood", count = 25 }]
get = [{ item = "gold_ore", count = 3 }]
times = 2

[[caravan.deal]]
give = [{ item = "stone", count = 15 }]
get = [{ item = "fruit", count = 5 }]
times = 2

[[caravan.deal]]
give = [{ item = "wares", count = 10 }]
get = [{ item = "brick", count = 8 }]
times = 2

[[caravan.deal]]
give = [{ item = "scroll_copy", count = 2 }]
get = [{ item = "metal", count = 3 }]
times = 1

[[caravan.request]]
name = "Food for the families at Fire Fountain City"
give = [{ item = "food", count = 40 }]
reward = { draw = 0.5 }

