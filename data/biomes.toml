# Biomes are painted onto land by region-growing from random seeds (see mapgen::assign_biomes).
# `glyph` is used by the ASCII renderer and golden tests.

[[biome]]
id = "plains"
name = "Plains"
glyph = ","

[[biome]]
id = "forest"
name = "Forest"
glyph = "\""

[[biome]]
id = "desert"
name = "Desert"
glyph = ":"

[[biome]]
id = "tundra"
name = "Tundra"
glyph = "*"
