# The end-game endeavor (docs/design/endgame.md, issue #224): the Harmony Gate, built with the
# Avatar. This file lists the signs a settlement must meet, all at once, before word reaches the
# Avatar. The endeavor becomes Ready the first time every sign is met, and stays Ready if a sign
# drops afterwards (stores eaten, say).
#
# [endeavor]
# - name:        what the UI calls the endeavor.
# - description: optional; one line under the name on the Endeavor screen.
# - building:    the building it raises (`endeavor = true` in buildings.toml). Needed exactly when
#                there are stages.
#
# [[sign]], listed in the order the UI shows them:
# - id:         unique; saves refer to signs by id, so renaming one forgets that it was met.
# - group:      people, buildings, knowledge, stores, harvests or bending.
# - name:       the sign's label.
# - kind:       what it counts, one of:
#     population      living units;
#     beds_for_all    beds against the population (no target: met when everyone has one);
#     every_building  distinct kinds of finished building, against every non-endeavor building
#                      the nation can ever unlock (no unlocking tech, or one unlocked by a shared
#                      tech or its own), minus `spare` (no target in the data: computed per
#                      nation, like `branch_complete`; docs/design/materials.md section 6, #354);
#     branch_complete every tech of the settlement's own nation known (no target);
#     stored          `items` in stockpiles, summed; `food = true` adds every edible item;
#     tally           a lifetime count: `tally = "harvested"` with `items`, or "scrolls_read";
#     masters         units with at least `bends` finished bends.
# - target:     the number to reach (at least 1). `per_nation = { air = 150 }` overrides it for
#               the nations named; the rest use `target`. Neither applies to a computed kind
#               (`beds_for_all`, `every_building`, `branch_complete`).
# - spare:      `every_building` only: kinds the player may skip, at least 0 (the default) and
#               below the smallest nation's reachable count.
# - hint:       optional; what the UI suggests while the sign isn't met.
#
# [[stage]], built in the order listed once the player has placed the site (issue #236):
# - id:   unique; saves refer to stages by id.
# - name: what the UI calls it.
# - cost: items a settler hauls to the site first, as `{ item, count }`; optional.
# - work: in-game seconds of construct work once `cost` is in, at a `construction` modifier of 1.0;
#         0 (the default) for a stage that is only tasks. A stage with a cost needs work.
# [[stage.task]], bends that finish the stage. Each waits for the stage's work, then for its own
# `cost` to be hauled to the site, then an eligible unit with `chi` to spare (in (0, chi.max],
# data/bending.toml) channels it for `work` seconds and spends the chi. A stage is done when its
# work and every task are.
# - id:      unique across every stage; saves refer to tasks by id.
# - element: who may do it: a unit of this nation, or "avatar" for a task only the Avatar may
#            claim (the Arch's beam lift). The Avatar may also do any nation's pillar task.
#
# [stage.rite] (issue #238, docs/design/endgame.md "The project": "The Harmony Rite"): marks the
# one stage that *is* the rite, instead of the usual cost/work/tasks (which must all be empty on
# it). The Avatar meditates on the plaza while settlers Attend; `world/gate.rs` tracks the
# minutes of attendance itself, pausing and resetting it rather than hauling and channelling.
# - minutes:           in-game minutes of attendance needed to finish.
# - attendance_share:  the share, in (0, 1], of the living population (the Avatar never counts)
#                       that must be on the plaza for progress to accrue; below it, it pauses.
#
# [avatar] (issue #237, docs/design/endgame.md "The Avatar"): Aang, who appears once the
# foundation stage is done and leaves only if neglected.
# - id, name, character: his own ids; `character` is an art id the sim never interprets.
# - chi_max:              his own full chi meter (may be more than data/bending.toml's chi.max).
# - [avatar.modifiers]:   his own work modifiers (data/nations.toml's `Modifiers` shape, every
#                         field required); `chi_regen` is his regen multiplier.
# - abilities:            the signature abilities he may cast (ids from data/bending.toml).
# - refuses:              foods (item ids) he won't eat raw or cooked.
# - patience_minutes:     how long his hunger or energy may stay at or below `low` before he
#                         leaves (an event names the reason); suspended once the Harmony Rite
#                         has begun (#238).
# - return_minutes:       how long he stays away once he has left.
# - arrive_after_minutes: how long after the foundation stage is done before he arrives.
# - farewell_minutes:     how long he stays for the celebration once the rite completes, before
#                         he flies off for good (#238; he doesn't come back in v1).
#
# A sign whose system doesn't exist yet stays out of this file, and the loader rejects a kind the
# sim can't count:
# - "100 crops harvested from farm plots" (harvests) arrives with farm plots, #198.
# - Ore mined counts gold only; metal ore joins it with #134.

[endeavor]
name = "The Harmony Gate"
building = "harmony_gate"
description = "A great work with the Avatar. When every sign is met, word of the settlement reaches Aang."

[[sign]]
id = "population"
group = "people"
name = "Population"
kind = "population"
target = 16
hint = "Spare beds and food draw newcomers"

[[sign]]
id = "beds"
group = "people"
name = "Everyone has a bed"
kind = "beds_for_all"
hint = "Build beds"

[[sign]]
id = "building_kinds"             # unchanged: saves refer to signs by id
group = "buildings"
name = "One of every building"
kind = "every_building"           # target: every non-endeavor building the nation can unlock
spare = 1                         # today: Air 7, Water 5, Earth 5, Fire 8
hint = "Raise something new"

[[sign]]
id = "branch"
group = "knowledge"
name = "The nation's branch complete"
kind = "branch_complete"
hint = "Research your branch"

[[sign]]
id = "food"
group = "stores"
name = "Food in stores"
kind = "stored"
food = true
target = 150
hint = "Stockpile food"

[[sign]]
id = "stone"
group = "stores"
name = "Stone in stores"
kind = "stored"
items = ["stone", "brick"]       # brick stands for stone one for one (#371, `stands_for`)
target = 200
hint = "Quarry stone (bricks count)"

[[sign]]
id = "ore"
group = "harvests"
name = "Ore mined"
kind = "tally"
tally = "harvested"
items = ["gold_ore"]
target = 40
hint = "Mine gold veins"

[[sign]]
id = "masters"
group = "bending"
name = "Bending masters (25 bends each)"
kind = "masters"
bends = 25
target = 3
hint = "Bend often"

[[sign]]
id = "scrolls"
group = "bending"
name = "Ancient scrolls read"
kind = "tally"
tally = "scrolls_read"
target = 3
hint = "Bring scrolls to a study hall"

# The stages (docs/design/endgame.md, "The project: four stages"). A pillar takes a full chi meter
# (the design's 150 is more than `chi.max` in bending.toml allows). The Arch's beam lift and the
# Harmony Rite need the Avatar, so they arrive with him. The Water pillar's "fresh water near the
# plaza" waits too: today it costs stone like the others.

[[stage]]
id = "foundation"
name = "Foundation"
cost = [{ item = "stone", count = 80 }, { item = "wood", count = 40 }]
work = 600.0

[[stage]]
id = "pillars"
name = "The Four Pillars"

[[stage.task]]
id = "air_pillar"
name = "Air pillar"
element = "air"
cost = [{ item = "stone", count = 20 }, { item = "wood", count = 10 }]
chi = 100.0
work = 60.0

[[stage.task]]
id = "water_pillar"
name = "Water pillar"
element = "water"
cost = [{ item = "stone", count = 20 }]
chi = 100.0
work = 60.0

[[stage.task]]
id = "earth_pillar"
name = "Earth pillar"
element = "earth"
cost = [{ item = "stone", count = 40 }]
chi = 100.0
work = 60.0

[[stage.task]]
id = "fire_pillar"
name = "Fire pillar"
element = "fire"
cost = [{ item = "stone", count = 20 }, { item = "gold_ore", count = 12 }]
chi = 100.0
work = 60.0

[[stage]]
id = "arch"
name = "The Arch"
cost = [
    { item = "wood", count = 60 },
    { item = "gold_ore", count = 20 },
    { item = "tool", count = 6 },
]
work = 600.0

[[stage.task]]
id = "beam_lift"
name = "Lift the beam"
element = "avatar"
chi = 50.0
work = 90.0

# The Harmony Rite (docs/design/endgame.md, "The Harmony Rite", #238): the last stage, with none
# of the usual cost, work or tasks. The Avatar meditates on the plaza while settlers Attend; ten
# minutes of that, with at least half the settlement attending, finishes the gate.
[[stage]]
id = "rite"
name = "The Harmony Rite"

[stage.rite]
minutes = 10.0
attendance_share = 0.5

# The Avatar (docs/design/endgame.md, "The Avatar"). Chi max and the regen multiplier
# (modifiers.chi_regen) are his own; the other work modifiers are the best of the four nations'.
[avatar]
id = "aang"
name = "Aang"
character = "aang"
chi_max = 200.0
patience_minutes = 20.0
return_minutes = 30.0
arrive_after_minutes = 2.0
farewell_minutes = 20.0
abilities = ["raise_earth", "water_the_land", "hearthflame", "wind_carry"]
refuses = ["fish"]

[avatar.modifiers]
move_speed = 1.6
carry_capacity = 1.0
earthworks = 2.5
heating = 2.5
water_work = 2.0
power_generation = 2.0
construction = 1.5
study = 1.0
chi_regen = 2.0
