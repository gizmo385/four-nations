id = "kenney-tiny-town"
title = "Tiny Town 1.1"
author = "Kenney (www.kenney.nl)"
url = "https://kenney.nl/assets/tiny-town"
download_url = "https://kenney.nl/media/pages/assets/tiny-town/a415fbeb49-1735736916/kenney_tiny-town.zip"
download_sha256 = "9768692dccff1d706408a5aedd6ca4f6cd1409506cbc84cb2f862919764be977"
license = "CC0-1.0"
release_ok = true
retrieved = "2026-10-21"
retrieved_by = "claude (rust-spike scoping session)"
notes = "Only Tilemap/tilemap_packed.png (12x11 grid of 16px tiles, no spacing) and License.txt were copied."

[[source]]
id = "thefournations-2013"
title = "The Four Nations (2013 Java/Swing version)"
author = "Christopher Chapline, James Fagan, Emily Leones, Michelle Yung (repo); original artists UNKNOWN"
url = "https://github.com/gizmo385/TheFourNations/tree/0a48b145a215278fd19cdbb6535985dc23690bab/images"
license = "UNKNOWN"
release_ok = false
retrieved = "2026-10-21"
retrieved_by = "claude (rust-spike scoping session)"
notes = """
The repo code is MIT, but the images' origin is undocumented. Unit sprites are chibi fan-art of
canon Avatar characters (Aang, Katara, Azula, ...) and were almost certainly not drawn by the team.
Unit sprites were GIF files with a .png extension; they were re-encoded to real RGBA PNGs
(pixels unchanged) and renamed, e.g. airDude1.png -> units/air-1.png, snowCoast.png -> terrain/snow-coast.png.
"""

[[source]]
id = "ninja-adventure"
title = "Ninja Adventure - Asset Pack"
author = "Pixel-Boy and AAA"
url = "https://pixel-boy.itch.io/ninja-adventure-asset-pack"
license = "CC0-1.0"
release_ok = true
download_sha256 = "95a06f4fdcfd1882f061a45ff313b7c905dbe2de1e8512b281d7937df62a7b15"
retrieved = "2026-10-22"
retrieved_by = "claude (implementer agent, #74), from the owner's local download"
notes = """
Copied from the owner's local itch.io download ("Ninja Adventure - Asset Pack.zip", 2,674 entries,
agents cannot fetch it themselves). Only the subset the game uses was copied, with the pack's
relative paths unchanged and no modifications: LICENSE.txt, six tilesets from Backgrounds/Tilesets
(Floor, Water, Nature, Relief, Desert, Field), and the sprite sheet and Faceset.png of the twelve
characters in docs/design/art.md under Actor/Character/. SamuraiRed's sheet is named
redsamurai.png upstream rather than SpriteSheet.png. Attribution is not required (CC0) but is
appreciated.
"""

