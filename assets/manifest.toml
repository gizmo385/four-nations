# Asset provenance manifest. EVERY file under assets/ (other than this one) must appear here.
# `cargo xtask assets` verifies coverage and sha256 hashes. See docs/process/assets.md.
#
# release_ok = false means the file may be used for local prototyping only and must be replaced
# before anything is published (web build, itch.io, public repo, screenshots on social media...).

