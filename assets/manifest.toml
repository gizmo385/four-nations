release_ok = true
download_sha256 = "95a06f4fdcfd1882f061a45ff313b7c905dbe2de1e8512b281d7937df62a7b15"
retrieved = "2026-10-22"
retrieved_by = "claude (implementer agent, #74), from the owner's local download"
notes = """
Copied from the owner's local itch.io download ("Ninja Adventure - Asset Pack.zip", 2,674 entries,
agents cannot fetch it themselves). Only the subset the game uses was copied, with the pack's
relative paths unchanged and no modifications: LICENSE.txt, six tilesets from Backgrounds/Tilesets
(Floor, Water, Nature, Relief, Desert, Field), and the sprite sheet and Faceset.png of the twelve
characters in docs/design/art.md under Actor/Character/. SamuraiRed's sheet is named
redsamurai.png upstream rather than SpriteSheet.png. Attribution is not required (CC0) but is
appreciated.
"""

