# Mockup only (#196, owner question 4): larger art for the 2x2 buildings. NOT game art: it is not
# in art/ or assets/, and nothing loads it. Each sprite is the current 32x32 grid from art/ reworked
# to a 32x48 cell: same width (it fills its 2x2 footprint), with storeys, roofs, chimneys and
# pillars raised so the roof rises up to one tile above the footprint. Bottom-aligned, feet on row
# 46, 1px ink outline, keys as in art/buildings.toml. `bison_stable_3x3` is a 48x48 cell for a 3x3
# footprint. If adopted, each sprite moves into its nation's art/ sheet with `cell = [32, 48]`.
